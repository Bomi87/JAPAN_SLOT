<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Japan Slot Availability</title>

  <style>
    :root {
      --background: #f2f5f9;
      --card: #ffffff;
      --border: #d8e0e9;
      --text: #172033;
      --muted: #667085;

      --primary: #1769e0;
      --primary-hover: #1058bd;

      --available-bg: #e5f8ed;
      --available-text: #087443;
      --available-border: #9edbb8;

      --unavailable-bg: #fff0f0;
      --unavailable-text: #c12424;
      --unavailable-border: #efb0b0;

      --alternative-bg: #fff6df;
      --alternative-text: #936000;
      --alternative-border: #e2b74e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    .page {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .page-header {
      margin-bottom: 18px;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--card);
      box-shadow:
        0 8px 28px
        rgba(16, 24, 40, 0.07);
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        0.8fr
        1fr
        1fr
        0.8fr;
      gap: 14px;
      align-items: end;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #475467;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      padding: 0 13px;
      border: 1px solid #cfd7e1;
      border-radius: 9px;
      background: white;
      color: var(--text);
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline:
        3px solid
        rgba(23, 105, 224, 0.14);

      border-color: var(--primary);
    }

    .button-row {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        auto
        auto;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      height: 48px;
      padding: 0 19px;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .primary-button {
      background: var(--primary);
      color: white;
    }

    .primary-button:hover {
      background: var(--primary-hover);
    }

    .secondary-button {
      min-width: 92px;
      background: #edf1f5;
      color: #344054;
    }

    .loading {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 11px;
      background: #edf4ff;
      color: #344f9b;
      text-align: center;
    }

    .error {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #efb4b4;
      border-radius: 10px;
      background: #fff0f0;
      color: #a51d1d;
      white-space: pre-wrap;
    }

    .connection-result {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid var(--available-border);
      border-radius: 10px;
      background: var(--available-bg);
      color: var(--available-text);
      text-align: center;
      font-weight: 700;
    }

    .result-panel {
      display: none;
      margin-top: 24px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fafbfc;
    }

    .result-layout {
      display: grid;
      grid-template-columns:
        minmax(250px, 1fr)
        minmax(220px, 0.8fr);
      gap: 18px;
      align-items: stretch;
    }

    .result-info {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }

    .result-info-title {
      margin-bottom: 15px;
      font-size: 14px;
      color: var(--muted);
    }

    .result-time {
      font-size: 30px;
      font-weight: 800;
    }

    .result-request {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .result-status {
      display: flex;
      min-height: 135px;
      justify-content: center;
      align-items: center;
      border: 1px solid transparent;
      border-radius: 12px;
      font-size: 27px;
      font-weight: 800;
      text-align: center;
    }

    .status-AVAILABLE {
      border-color: var(--available-border);
      background: var(--available-bg);
      color: var(--available-text);
    }

    .status-UNAVAILABLE {
      border-color: var(--unavailable-border);
      background: var(--unavailable-bg);
      color: var(--unavailable-text);
    }

    .status-ALTERNATIVE {
      border-color: var(--alternative-border);
      background: var(--alternative-bg);
      color: var(--alternative-text);
    }

    .alternative-area {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--alternative-border);
      border-radius: 11px;
      background: #fffaf0;
    }

    .alternative-title {
      margin-bottom: 9px;
      color: var(--alternative-text);
      font-size: 13px;
      font-weight: 700;
    }

    .alternative-chip {
      display: inline-block;
      margin: 3px 7px 3px 0;
      padding: 7px 12px;
      border: 1px solid var(--alternative-border);
      border-radius: 999px;
      color: #795000;
      font-weight: 700;
    }

    .checked-at {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    @media (max-width: 800px) {
      .form-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .form-grid,
      .result-layout,
      .button-row {
        grid-template-columns: 1fr;
      }

      .page {
        padding: 12px 9px 35px;
      }

      .panel {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="page-header">
      <h1>
        Japan Slot Availability
      </h1>

      <p>
        일본 공항의 출발 또는 도착 슬롯을
        선택한 시간 기준으로 확인합니다.
      </p>
    </header>

    <section class="panel">
      <div class="form-grid">
        <div class="field">
          <label for="mode">
            조회 기준
          </label>

          <select id="mode">
            <option value="arrival" selected>
              도착
            </option>

            <option value="departure">
              출발
            </option>
          </select>
        </div>

        <div class="field">
          <label for="airport">
            공항 ICAO
          </label>

          <input
            id="airport"
            maxlength="4"
            placeholder="예: RJTT"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="date">
            기준 날짜
          </label>

          <input
            id="date"
            type="date"
          >
        </div>

        <div class="field">
          <label for="time">
            기준 시간
          </label>

          <select id="time"></select>
        </div>
      </div>

      <div class="button-row">
        <button
          type="button"
          id="searchButton"
          class="primary-button"
          onclick="runSearch()"
        >
          선택 시간 슬롯 조회
        </button>

        <button
          type="button"
          id="connectionButton"
          class="secondary-button"
          onclick="testBackendConnection()"
        >
          연결 확인
        </button>

        <button
          type="button"
          id="resetButton"
          class="secondary-button"
          onclick="resetForm()"
        >
          초기화
        </button>
      </div>

      <div
        id="loading"
        class="loading"
      >
        선택한 시간의 슬롯을 확인하고 있습니다.
      </div>

      <div
        id="connectionResult"
        class="connection-result"
      ></div>

      <div
        id="error"
        class="error"
      ></div>

      <section
        id="resultPanel"
        class="result-panel"
      >
        <div class="result-layout">
          <div class="result-info">
            <div class="result-info-title">
              조회 조건
            </div>

            <div
              id="resultTime"
              class="result-time"
            ></div>

            <div
              id="resultRequest"
              class="result-request"
            ></div>
          </div>

          <div
            id="resultStatus"
            class="result-status"
          ></div>
        </div>

        <div
          id="alternativeArea"
          class="alternative-area"
        >
          <div class="alternative-title">
            대체 가능 시간
          </div>

          <div id="alternativeList"></div>
        </div>

        <div
          id="checkedAt"
          class="checked-at"
        ></div>
      </section>
    </section>
  </main>

  <script>
    const BACKEND_URL =
      'https://script.google.com/macros/s/AKfycbwgM3HlDeB6LO6A-AmESiG7KBGA9lsrloLxt0S70ix-QY7Z8WyungoG9rO19FGOQGN7MQ/exec';

    const FRONTEND_API_KEY =
      'slot-app-2026-MOMOBOMI';

    const REQUEST_TIMEOUT_MS =
      60000;

    initialize();

    function initialize() {
      setDefaultDate();
      createTimeOptions();
      bindAirportInput();
    }

    function setDefaultDate() {
      const now =
        new Date();

      const localDate =
        new Date(
          now.getTime() -
          now.getTimezoneOffset() * 60000
        );

      document
        .getElementById('date')
        .value =
          localDate
            .toISOString()
            .substring(0, 10);
    }

    function createTimeOptions() {
      const select =
        document.getElementById(
          'time'
        );

      let html = '';

      for (
        let index = 0;
        index <= 48;
        index++
      ) {
        const totalMinutes =
          index * 30;

        const hour =
          Math.floor(
            totalMinutes / 60
          );

        const minute =
          totalMinutes % 60;

        const value =
          index === 48
            ? '24:00'
            : String(hour)
                .padStart(2, '0') +
              ':' +
              String(minute)
                .padStart(2, '0');

        const label =
          index === 48
            ? '2400L'
            : value.replace(':', '') +
              'L';

        html += `
          <option value="${value}">
            ${label}
          </option>
        `;
      }

      select.innerHTML =
        html;

      /*
       * 기본 선택 시간 12:00
       */
      select.value =
        '12:00';
    }

    function bindAirportInput() {
      document
        .getElementById('airport')
        .addEventListener(
          'input',
          function() {
            this.value =
              this.value
                .toUpperCase()
                .replace(/[^A-Z]/g, '')
                .substring(0, 4);
          }
        );
    }

    async function runSearch() {
      clearMessages();

      const request = {
        mode:
          getValue('mode'),

        airport:
          getValue('airport')
            .toUpperCase(),

        date:
          normalizeDate(
            getValue('date')
          ),

        time:
          getValue('time')
      };

      const validationError =
        validateRequest(
          request
        );

      if (validationError) {
        showError(
          validationError
        );

        return;
      }

      document
        .getElementById(
          'resultPanel'
        )
        .style.display =
          'none';

      setLoading(true);

      try {
        const response =
          await callBackend({
            action:
              'checkSingleSlot',

            apiKey:
              FRONTEND_API_KEY,

            data:
              request
          });

        renderResult(
          response
        );

      } catch (error) {
        showError(
          error && error.message
            ? error.message
            : String(error)
        );

      } finally {
        setLoading(false);
      }
    }

    function renderResult(
      response
    ) {
      if (
        !response ||
        response.success !== true
      ) {
        showError(
          response &&
          response.message
            ? response.message
            : '조회에 실패했습니다.'
        );

        return;
      }

      const row =
        response.result || {};

      const alternatives =
        Array.isArray(
          row.alternatives
        )
          ? row.alternatives
              .map(
                normalizeAlternativeTime
              )
              .filter(Boolean)
          : [];

      let status;

      if (
        alternatives.length > 0
      ) {
        status =
          'ALTERNATIVE';

      } else if (
        row.status ===
        'AVAILABLE'
      ) {
        status =
          'AVAILABLE';

      } else {
        status =
          'UNAVAILABLE';
      }

      document
        .getElementById(
          'resultTime'
        )
        .textContent =
          row.displayTime || '-';

      document
        .getElementById(
          'resultRequest'
        )
        .textContent =
          row.requestDate +
          ' ' +
          row.requestTime;

      const statusElement =
        document.getElementById(
          'resultStatus'
        );

      statusElement.className =
        'result-status status-' +
        status;

      statusElement.textContent =
        getStatusLabel(
          status
        );

      const alternativeArea =
        document.getElementById(
          'alternativeArea'
        );

      const alternativeList =
        document.getElementById(
          'alternativeList'
        );

      if (
        alternatives.length > 0
      ) {
        alternativeList.innerHTML =
          alternatives
            .map(
              function(time) {
                return `
                  <span class="alternative-chip">
                    ${escapeHtml(time)}
                  </span>
                `;
              }
            )
            .join('');

        alternativeArea.style.display =
          'block';

      } else {
        alternativeList.innerHTML =
          '';

        alternativeArea.style.display =
          'none';
      }

      const elapsed =
        response.elapsedSeconds !==
        undefined
          ? ' · 소요시간: ' +
            response.elapsedSeconds +
            '초'
          : '';

      document
        .getElementById(
          'checkedAt'
        )
        .textContent =
          '조회 시각: ' +
          (
            response.checkedAt ||
            '-'
          ) +
          elapsed;

      document
        .getElementById(
          'resultPanel'
        )
        .style.display =
          'block';
    }

    function getStatusLabel(
      status
    ) {
      if (
        status === 'AVAILABLE'
      ) {
        return '✅ 가능';
      }

      if (
        status === 'ALTERNATIVE'
      ) {
        return '🔄 대체 시간';
      }

      return '❌ 불가';
    }

    function normalizeAlternativeTime(
      value
    ) {
      let text =
        String(
          value || ''
        ).trim();

      text =
        text
          .replaceAll(
            '（',
            '('
          )
          .replaceAll(
            '）',
            ')'
          );

      text =
        text.replace(
          /^\s*\(\s*後\s*\)\s*/,
          '익일 '
        );

      text =
        text.replace(
          /^\s*\(\s*前\s*\)\s*/,
          '전일 '
        );

      return text.trim();
    }

    async function testBackendConnection() {
      clearMessages();
      setConnectionLoading(true);

      try {
        const response =
          await callBackend({
            action: 'ping',
            apiKey: FRONTEND_API_KEY
          });

        if (
          !response ||
          response.success !== true
        ) {
          throw new Error(
            response &&
            response.message
              ? response.message
              : '연결 실패'
          );
        }

        showConnectionResult(
          '백엔드 연결 성공'
        );

      } catch (error) {
        showError(
          error && error.message
            ? error.message
            : String(error)
        );

      } finally {
        setConnectionLoading(false);
      }
    }

    async function callBackend(
      payload
    ) {
      validateBackendUrl();

      const controller =
        new AbortController();

      const timeoutId =
        setTimeout(
          function() {
            controller.abort();
          },
          REQUEST_TIMEOUT_MS
        );

      try {
        const response =
          await fetch(
            BACKEND_URL,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain;charset=UTF-8'
              },

              body:
                JSON.stringify(
                  payload
                ),

              redirect:
                'follow',

              signal:
                controller.signal,

              cache:
                'no-store'
            }
          );

        if (!response.ok) {
          throw new Error(
            '백엔드 HTTP 오류: ' +
            response.status
          );
        }

        const text =
          await response.text();

        return JSON.parse(
          text
        );

      } catch (error) {
        if (
          error &&
          error.name === 'AbortError'
        ) {
          throw new Error(
            '백엔드 응답 시간이 초과되었습니다.'
          );
        }

        throw error;

      } finally {
        clearTimeout(
          timeoutId
        );
      }
    }

    function validateRequest(
      request
    ) {
      if (
        request.mode !==
          'arrival' &&
        request.mode !==
          'departure'
      ) {
        return '조회 기준을 선택하세요.';
      }

      if (
        !/^[A-Z]{4}$/.test(
          request.airport
        )
      ) {
        return (
          '공항 ICAO 코드를 영문 4자리로 입력하세요.'
        );
      }

      if (
        !request.date
      ) {
        return '날짜를 입력하세요.';
      }

      if (
        !request.time
      ) {
        return '시간을 선택하세요.';
      }

      return '';
    }

    function resetForm() {
      document
        .getElementById('mode')
        .value =
          'arrival';

      document
        .getElementById('airport')
        .value =
          '';

      setDefaultDate();

      document
        .getElementById('time')
        .value =
          '12:00';

      clearMessages();

      document
        .getElementById(
          'resultPanel'
        )
        .style.display =
          'none';
    }

    function setLoading(
      loading
    ) {
      document
        .getElementById(
          'loading'
        )
        .style.display =
          loading
            ? 'block'
            : 'none';

      document
        .getElementById(
          'searchButton'
        )
        .disabled =
          loading;
    }

    function setConnectionLoading(
      loading
    ) {
      const button =
        document.getElementById(
          'connectionButton'
        );

      button.disabled =
        loading;

      button.textContent =
        loading
          ? '연결 중...'
          : '연결 확인';
    }

    function showConnectionResult(
      message
    ) {
      const element =
        document.getElementById(
          'connectionResult'
        );

      element.textContent =
        message;

      element.style.display =
        'block';
    }

    function showError(
      message
    ) {
      const element =
        document.getElementById(
          'error'
        );

      element.textContent =
        message;

      element.style.display =
        'block';
    }

    function clearMessages() {
      document
        .getElementById('error')
        .style.display =
          'none';

      document
        .getElementById(
          'connectionResult'
        )
        .style.display =
          'none';
    }

    function validateBackendUrl() {
      if (
        BACKEND_URL.includes(
          '여기에_배포_ID'
        )
      ) {
        throw new Error(
          'BACKEND_URL에 실제 /exec 주소를 입력하세요.'
        );
      }
    }

    function getValue(id) {
      return document
        .getElementById(id)
        .value
        .trim();
    }

    function normalizeDate(
      value
    ) {
      return String(value)
        .replace(
          /-/g,
          '/'
        );
    }

    function escapeHtml(
      value
    ) {
      return String(value)
        .replaceAll(
          '&',
          '&amp;'
        )
        .replaceAll(
          '<',
          '&lt;'
        )
        .replaceAll(
          '>',
          '&gt;'
        )
        .replaceAll(
          '"',
          '&quot;'
        )
        .replaceAll(
          "'",
          '&#039;'
        );
    }
  </script>
</body>
</html>
