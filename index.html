<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Japan Slot Availability</title>

  <style>
    :root {
      --background: #f2f5f9;
      --card: #ffffff;
      --border: #d8e0e9;
      --text: #172033;
      --muted: #667085;
      --primary: #1769e0;
      --primary-hover: #1058bd;

      --available-bg: #e9f9f0;
      --available-text: #087443;

      --unavailable-bg: #fff0f0;
      --unavailable-text: #b42318;

      --alternative-bg: #fff7e4;
      --alternative-text: #8b5b00;

      --period-bg: #edf3ff;
      --period-text: #344f9b;

      --ignored-bg: #f2f4f7;
      --ignored-text: #667085;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    .page {
      width: min(1050px, 100%);
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .page-header {
      margin-bottom: 17px;
    }

    .page-header h1 {
      margin: 0 0 7px;
      font-size: 27px;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .panel {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      box-shadow:
        0 8px 28px
        rgba(16, 24, 40, 0.07);
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        minmax(170px, 0.8fr)
        minmax(220px, 1fr)
        minmax(220px, 1fr);
      gap: 14px;
      align-items: end;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #475467;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border: 1px solid #cfd7e1;
      border-radius: 9px;
      background: white;
      color: var(--text);
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline:
        3px solid
        rgba(23, 105, 224, 0.14);

      border-color: var(--primary);
    }

    .button-row {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        auto
        auto;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      height: 48px;
      padding: 0 19px;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .primary-button {
      background: var(--primary);
      color: white;
    }

    .primary-button:hover {
      background: var(--primary-hover);
    }

    .secondary-button {
      min-width: 90px;
      background: #edf1f5;
      color: #344054;
    }

    .loading {
      display: none;
      margin-top: 17px;
      padding: 17px;
      border-radius: 10px;
      background: #edf4ff;
      color: #344f9b;
      text-align: center;
      line-height: 1.6;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      margin-right: 8px;
      border: 2px solid
        rgba(52, 79, 155, 0.25);
      border-top-color: #344f9b;
      border-radius: 50%;
      vertical-align: middle;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      display: none;
      margin-top: 17px;
      padding: 14px;
      border: 1px solid #efb4b4;
      border-radius: 10px;
      background: #fff0f0;
      color: #a51d1d;
      white-space: pre-wrap;
      line-height: 1.55;
    }

    .connection-result {
      display: none;
      margin-top: 17px;
      padding: 13px;
      border-radius: 10px;
      background: var(--available-bg);
      color: var(--available-text);
      text-align: center;
      font-weight: 700;
    }

    .results {
      display: none;
      margin-top: 23px;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 14px;
    }

    .result-heading h2 {
      margin: 0;
      font-size: 21px;
    }

    .checked-at {
      color: var(--muted);
      font-size: 12px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns:
        repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-card {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafbfc;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
    }

    .summary-number {
      margin-top: 5px;
      font-size: 22px;
      font-weight: 800;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 13px;
    }

    .filter-button {
      height: 36px;
      padding: 0 13px;
      border: 1px solid var(--border);
      background: white;
      color: #475467;
      font-size: 13px;
    }

    .filter-button.active {
      border-color: var(--primary);
      background: #edf4ff;
      color: var(--primary);
    }

    .table-container {
      max-height: 650px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 14px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 4;
      background: #f7f9fb;
    }

    th,
    td {
      padding: 11px 13px;
      border-bottom: 1px solid #e8ecf1;
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: #475467;
      font-size: 12px;
    }

    tbody tr:hover {
      background: #fafcff;
    }

    .time-cell {
      font-size: 15px;
      font-weight: 800;
    }

    .status-badge {
      display: inline-flex;
      min-width: 108px;
      justify-content: center;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .status-AVAILABLE {
      background: var(--available-bg);
      color: var(--available-text);
    }

    .status-UNAVAILABLE {
      background: var(--unavailable-bg);
      color: var(--unavailable-text);
    }

    .status-ALTERNATIVE {
      background: var(--alternative-bg);
      color: var(--alternative-text);
    }

    .status-OUT_OF_PERIOD {
      background: var(--period-bg);
      color: var(--period-text);
    }

    .status-IGNORED,
    .status-UNKNOWN {
      background: var(--ignored-bg);
      color: var(--ignored-text);
    }

    .alternative-chip {
      display: inline-block;
      margin: 2px 5px 2px 0;
      padding: 5px 9px;
      border: 1px solid #dfc071;
      border-radius: 999px;
      background: #fffaf0;
      color: #795000;
      font-size: 12px;
      font-weight: 700;
    }

    .empty-value {
      color: #98a2b3;
    }

    .note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .summary-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .page {
        padding: 12px 9px 35px;
      }

      .panel {
        padding: 14px;
      }

      .button-row {
        grid-template-columns: 1fr;
      }

      .result-heading {
        display: block;
      }

      .checked-at {
        margin-top: 6px;
      }

      th,
      td {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="page-header">
      <h1>
        Japan Slot Availability
      </h1>

      <p>
        일본 공항의 출발 또는 도착 슬롯을
        0000L부터 2400L까지 30분 간격으로 확인합니다.
      </p>
    </header>

    <section class="panel">
      <div class="form-grid">
        <div class="field">
          <label for="mode">
            조회 기준
          </label>

          <select id="mode">
            <option value="departure">
              출발
            </option>

            <option value="arrival">
              도착
            </option>
          </select>
        </div>

        <div class="field">
          <label for="airport">
            공항 ICAO
          </label>

          <input
            id="airport"
            maxlength="4"
            placeholder="예: RJTT"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="date">
            기준 날짜
          </label>

          <input
            id="date"
            type="date"
          >
        </div>
      </div>

      <div class="button-row">
        <button
          type="button"
          id="searchButton"
          class="primary-button"
          onclick="runSearch()"
        >
          하루 전체 슬롯 조회
        </button>

        <button
          type="button"
          id="connectionButton"
          class="secondary-button"
          onclick="testBackendConnection()"
        >
          연결 확인
        </button>

        <button
          type="button"
          id="resetButton"
          class="secondary-button"
          onclick="resetForm()"
        >
          초기화
        </button>
      </div>

      <div
        id="loading"
        class="loading"
      >
        <span class="spinner"></span>
        49개 시간대의 슬롯을 확인하고 있습니다.<br>
        잠시 기다려 주세요.
      </div>

      <div
        id="connectionResult"
        class="connection-result"
      ></div>

      <div
        id="error"
        class="error"
      ></div>

      <section
        id="results"
        class="results"
      >
        <div class="result-heading">
          <h2>
            조회 결과
          </h2>

          <div
            id="checkedAt"
            class="checked-at"
          ></div>
        </div>

        <div class="summary-grid">
          <div class="summary-card">
            <div class="summary-label">
              전체
            </div>

            <div
              id="summaryTotal"
              class="summary-number"
            >
              0
            </div>
          </div>

          <div class="summary-card">
            <div class="summary-label">
              사용 가능
            </div>

            <div
              id="summaryAvailable"
              class="summary-number"
            >
              0
            </div>
          </div>

          <div class="summary-card">
            <div class="summary-label">
              사용 불가
            </div>

            <div
              id="summaryUnavailable"
              class="summary-number"
            >
              0
            </div>
          </div>

          <div class="summary-card">
            <div class="summary-label">
              대체 시간 있음
            </div>

            <div
              id="summaryAlternative"
              class="summary-number"
            >
              0
            </div>
          </div>

          <div class="summary-card">
            <div class="summary-label">
              기간 외
            </div>

            <div
              id="summaryOutOfPeriod"
              class="summary-number"
            >
              0
            </div>
          </div>
        </div>

        <div class="filter-row">
          <button
            type="button"
            class="filter-button active"
            data-filter="ALL"
            onclick="setFilter('ALL', this)"
          >
            전체
          </button>

          <button
            type="button"
            class="filter-button"
            data-filter="AVAILABLE"
            onclick="setFilter('AVAILABLE', this)"
          >
            가능
          </button>

          <button
            type="button"
            class="filter-button"
            data-filter="UNAVAILABLE"
            onclick="setFilter('UNAVAILABLE', this)"
          >
            불가
          </button>

          <button
            type="button"
            class="filter-button"
            data-filter="ALTERNATIVE"
            onclick="setFilter('ALTERNATIVE', this)"
          >
            대체 시간
          </button>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Local Time</th>
                <th>결과</th>
                <th>대체 가능 시간</th>
                <th>API 요청 일시</th>
              </tr>
            </thead>

            <tbody id="resultBody"></tbody>
          </table>
        </div>

        <div class="note">
          2400L은 다음 날짜 00:00으로 변환하여 조회합니다.
          출발을 선택하면 출발 슬롯을 확인하고,
          도착을 선택하면 도착 슬롯을 확인합니다.
        </div>
      </section>
    </section>
  </main>

  <script>
    /*
     * 반드시 실제 Apps Script 웹앱 URL로 교체
     *
     * 예:
     * https://script.google.com/macros/s/AKfycbxxxxxxxx/exec
     */
    const BACKEND_URL =
      'https://script.google.com/macros/s/AKfycbwgM3HlDeB6LO6A-AmESiG7KBGA9lsrloLxt0S70ix-QY7Z8WyungoG9rO19FGOQGN7MQ/exec';

    const FRONTEND_API_KEY =
      'slot-app-2026-MOMOBOMI';

    /*
     * 백엔드 응답 대기 제한
     */
    const REQUEST_TIMEOUT_MS =
      120000;

    let allRows = [];
    let activeFilter = 'ALL';

    initialize();

    function initialize() {
      setDefaultDate();
      bindAirportInput();
    }

    function setDefaultDate() {
      const now = new Date();

      const localDate = new Date(
        now.getTime() -
        now.getTimezoneOffset() * 60000
      );

      document
        .getElementById('date')
        .value =
          localDate
            .toISOString()
            .substring(0, 10);
    }

    function bindAirportInput() {
      document
        .getElementById('airport')
        .addEventListener(
          'input',
          function() {
            this.value = this.value
              .toUpperCase()
              .replace(/[^A-Z]/g, '')
              .substring(0, 4);
          }
        );
    }

    async function runSearch() {
      clearMessages();

      const request = {
        mode:
          getValue('mode'),

        airport:
          getValue('airport')
            .toUpperCase(),

        date:
          normalizeDate(
            getValue('date')
          )
      };

      const validationError =
        validateRequest(request);

      if (validationError) {
        showError(validationError);
        return;
      }

      document
        .getElementById('results')
        .style.display = 'none';

      setLoading(true);

      try {
        const result =
          await callBackend({
            action:
              'checkFullDaySlots',

            apiKey:
              FRONTEND_API_KEY,

            data:
              request
          });

        handleSuccess(result);

      } catch (error) {
        handleFailure(error);

      } finally {
        setLoading(false);
      }
    }

    async function testBackendConnection() {
      clearMessages();
      setConnectionLoading(true);

      try {
        const result =
          await callBackend({
            action: 'ping',
            apiKey: FRONTEND_API_KEY
          });

        if (
          !result ||
          result.success !== true
        ) {
          throw new Error(
            result && result.message
              ? result.message
              : '백엔드 연결에 실패했습니다.'
          );
        }

        const message =
          result.timestamp
            ? `백엔드 연결 성공 · ${result.timestamp}`
            : '백엔드 연결 성공';

        showConnectionResult(message);

      } catch (error) {
        showError(
          '백엔드 연결 실패\n' +
          (
            error && error.message
              ? error.message
              : String(error)
          )
        );

      } finally {
        setConnectionLoading(false);
      }
    }

    async function callBackend(payload) {
      validateBackendUrl();

      const controller =
        new AbortController();

      const timeoutId =
        setTimeout(
          function() {
            controller.abort();
          },
          REQUEST_TIMEOUT_MS
        );

      try {
        /*
         * text/plain 사용:
         * OPTIONS preflight 요청을 피하기 위한 방식
         */
        const response =
          await fetch(
            BACKEND_URL,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain;charset=UTF-8'
              },

              body:
                JSON.stringify(payload),

              redirect:
                'follow',

              signal:
                controller.signal,

              cache:
                'no-store'
            }
          );

        if (!response.ok) {
          throw new Error(
            `백엔드 HTTP 오류: ${response.status}`
          );
        }

        const responseText =
          await response.text();

        if (!responseText) {
          throw new Error(
            '백엔드 응답이 비어 있습니다.'
          );
        }

        try {
          return JSON.parse(
            responseText
          );

        } catch (error) {
          throw new Error(
            '백엔드 응답이 JSON 형식이 아닙니다.\n' +
            responseText.substring(0, 500)
          );
        }

      } catch (error) {
        if (
          error &&
          error.name === 'AbortError'
        ) {
          throw new Error(
            '백엔드 응답 시간이 초과되었습니다.'
          );
        }

        throw error;

      } finally {
        clearTimeout(timeoutId);
      }
    }

    function validateBackendUrl() {
      if (
        !BACKEND_URL ||
        BACKEND_URL.includes(
          '여기에_배포_ID'
        ) ||
        !BACKEND_URL.endsWith('/exec')
      ) {
        throw new Error(
          '프론트 코드의 BACKEND_URL에 실제 Apps Script /exec 주소를 입력하세요.'
        );
      }
    }

    function handleSuccess(response) {
      if (
        !response ||
        response.success !== true
      ) {
        showError(
          response &&
          response.message
            ? response.message
            : '조회에 실패했습니다.'
        );

        return;
      }

      allRows =
        Array.isArray(response.rows)
          ? response.rows
          : [];

      activeFilter = 'ALL';

      renderSummary(
        response.summary || {}
      );

      updateFilterButtons();
      renderRows();

      const elapsedText =
        response.elapsedSeconds !==
        undefined
          ? ` · 소요시간: ${response.elapsedSeconds}초`
          : '';

      document
        .getElementById('checkedAt')
        .textContent =
          `조회 시각: ${response.checkedAt || '-'}` +
          elapsedText;

      document
        .getElementById('results')
        .style.display = 'block';
    }

    function handleFailure(error) {
      showError(
        error && error.message
          ? error.message
          : String(error)
      );
    }

    function renderSummary(summary) {
      setText(
        'summaryTotal',
        summary.total || 0
      );

      setText(
        'summaryAvailable',
        summary.available || 0
      );

      setText(
        'summaryUnavailable',
        summary.unavailable || 0
      );

      setText(
        'summaryAlternative',
        summary.alternative || 0
      );

      setText(
        'summaryOutOfPeriod',
        summary.outOfPeriod || 0
      );
    }

    function renderRows() {
      const body =
        document.getElementById(
          'resultBody'
        );

      const rows =
        allRows.filter(function(row) {
          if (activeFilter === 'ALL') {
            return true;
          }

          if (
            activeFilter ===
            'UNAVAILABLE'
          ) {
            return (
              row.status ===
                'UNAVAILABLE' ||
              row.status ===
                'OUT_OF_PERIOD' ||
              row.status ===
                'UNKNOWN'
            );
          }

          return (
            row.status ===
            activeFilter
          );
        });

      if (rows.length === 0) {
        body.innerHTML = `
          <tr>
            <td colspan="4">
              표시할 결과가 없습니다.
            </td>
          </tr>
        `;

        return;
      }

      body.innerHTML =
        rows
          .map(createRowHtml)
          .join('');
    }

    function createRowHtml(row) {
      const alternatives =
        Array.isArray(
          row.alternatives
        )
          ? row.alternatives
          : [];

      const alternativeHtml =
        alternatives.length > 0
          ? alternatives
              .map(function(time) {
                return `
                  <span
                    class="alternative-chip"
                  >
                    ${escapeHtml(time)}
                  </span>
                `;
              })
              .join('')
          : `
              <span class="empty-value">
                -
              </span>
            `;

      return `
        <tr>
          <td class="time-cell">
            ${escapeHtml(
              row.displayTime
            )}
          </td>

          <td>
            <span
              class="
                status-badge
                status-${escapeHtml(
                  row.status
                )}
              "
            >
              ${escapeHtml(
                getStatusLabel(
                  row.status
                )
              )}
            </span>
          </td>

          <td>
            ${alternativeHtml}
          </td>

          <td>
            ${escapeHtml(
              row.requestDate
            )}
            ${escapeHtml(
              row.requestTime
            )}
          </td>
        </tr>
      `;
    }

    function getStatusLabel(status) {
      const labels = {
        AVAILABLE:
          '✅ 사용 가능',

        UNAVAILABLE:
          '❌ 사용 불가',

        ALTERNATIVE:
          '🔄 대체 시간',

        OUT_OF_PERIOD:
          '⏰ 기간 외',

        IGNORED:
          '➖ 확인 제외',

        UNKNOWN:
          '⚠️ 결과 없음'
      };

      return (
        labels[status] ||
        status ||
        '알 수 없음'
      );
    }

    function setFilter(
      filter,
      selectedButton
    ) {
      activeFilter = filter;

      updateFilterButtons(
        selectedButton
      );

      renderRows();
    }

    function updateFilterButtons(
      selectedButton
    ) {
      document
        .querySelectorAll(
          '.filter-button'
        )
        .forEach(function(button) {
          const active =
            selectedButton
              ? button === selectedButton
              : button.dataset.filter ===
                activeFilter;

          button.classList.toggle(
            'active',
            active
          );
        });
    }

    function validateRequest(request) {
      if (
        request.mode !== 'departure' &&
        request.mode !== 'arrival'
      ) {
        return '조회 기준을 선택하세요.';
      }

      if (
        !/^[A-Z]{4}$/.test(
          request.airport
        )
      ) {
        return (
          '공항 ICAO 코드를 4자리로 입력하세요.'
        );
      }

      if (
        !/^\d{4}\/\d{2}\/\d{2}$/.test(
          request.date
        )
      ) {
        return '조회 날짜를 입력하세요.';
      }

      return '';
    }

    function resetForm() {
      document
        .getElementById('mode')
        .value = 'departure';

      document
        .getElementById('airport')
        .value = '';

      setDefaultDate();

      allRows = [];
      activeFilter = 'ALL';

      clearMessages();

      document
        .getElementById('results')
        .style.display = 'none';

      updateFilterButtons();
    }

    function setLoading(loading) {
      document
        .getElementById('loading')
        .style.display =
          loading
            ? 'block'
            : 'none';

      document
        .getElementById(
          'searchButton'
        )
        .disabled = loading;

      document
        .getElementById(
          'connectionButton'
        )
        .disabled = loading;

      document
        .getElementById(
          'resetButton'
        )
        .disabled = loading;
    }

    function setConnectionLoading(
      loading
    ) {
      const button =
        document.getElementById(
          'connectionButton'
        );

      button.disabled = loading;

      button.textContent =
        loading
          ? '연결 중...'
          : '연결 확인';
    }

    function showConnectionResult(
      message
    ) {
      const element =
        document.getElementById(
          'connectionResult'
        );

      element.textContent = message;
      element.style.display = 'block';
    }

    function showError(message) {
      const element =
        document.getElementById(
          'error'
        );

      element.textContent = message;
      element.style.display = 'block';
    }

    function clearMessages() {
      const errorElement =
        document.getElementById(
          'error'
        );

      const connectionElement =
        document.getElementById(
          'connectionResult'
        );

      errorElement.textContent = '';
      errorElement.style.display =
        'none';

      connectionElement.textContent =
        '';

      connectionElement.style.display =
        'none';
    }

    function getValue(id) {
      return document
        .getElementById(id)
        .value
        .trim();
    }

    function normalizeDate(value) {
      return String(value)
        .replace(/-/g, '/');
    }

    function setText(id, value) {
      document
        .getElementById(id)
        .textContent =
          String(value);
    }

    function escapeHtml(value) {
      return String(
        value === null ||
        value === undefined
          ? ''
          : value
      )
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>
</body>
</html>
