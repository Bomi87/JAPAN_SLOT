<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>MLIT Slot Availability</title>

  <style>
    :root {
      --background: #f2f5f9;
      --card: #ffffff;
      --border: #d8e0e9;
      --text: #172033;
      --muted: #667085;
      --primary: #1769e0;
      --primary-hover: #1058bd;

      --available-background: #e9f9f0;
      --available-text: #087443;

      --unavailable-background: #fff0f0;
      --unavailable-text: #b42318;

      --alternative-background: #fff7e4;
      --alternative-text: #8b5b00;

      --period-background: #edf3ff;
      --period-text: #344f9b;

      --ignored-background: #f2f4f7;
      --ignored-text: #667085;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .page-header {
      margin-bottom: 17px;
    }

    .page-header h1 {
      margin: 0 0 7px;
      font-size: 27px;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .panel {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      box-shadow:
        0 8px 28px
        rgba(16, 24, 40, 0.07);
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        1fr 1fr 1fr 1fr 1fr;
      gap: 12px;
      align-items: end;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #475467;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      height: 44px;
      padding: 0 11px;
      border: 1px solid #cfd7e1;
      border-radius: 9px;
      background: white;
      color: var(--text);
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline:
        3px solid
        rgba(23, 105, 224, 0.14);

      border-color:
        var(--primary);
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 17px;
    }

    button {
      height: 46px;
      padding: 0 19px;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .primary-button {
      flex: 1;
      background: var(--primary);
      color: white;
    }

    .primary-button:hover {
      background:
        var(--primary-hover);
    }

    .secondary-button {
      background: #edf1f5;
      color: #344054;
    }

    .loading {
      display: none;
      margin-top: 17px;
      padding: 14px;
      border-radius: 10px;
      background: #edf4ff;
      color: #344f9b;
      text-align: center;
      line-height: 1.5;
    }

    .error {
      display: none;
      margin-top: 17px;
      padding: 14px;
      border: 1px solid #efb4b4;
      border-radius: 10px;
      background: #fff0f0;
      color: #a51d1d;
      white-space: pre-wrap;
      line-height: 1.55;
    }

    .results {
      display: none;
      margin-top: 23px;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 14px;
    }

    .result-heading h2 {
      margin: 0;
      font-size: 21px;
    }

    .checked-at {
      color: var(--muted);
      font-size: 12px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns:
        repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-card {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafbfc;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
    }

    .summary-number {
      margin-top: 5px;
      font-size: 22px;
      font-weight: 800;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 13px;
    }

    .filter-button {
      height: 36px;
      padding: 0 13px;
      border:
        1px solid
        var(--border);
      background: white;
      color: #475467;
      font-size: 13px;
    }

    .filter-button.active {
      border-color:
        var(--primary);
      background: #edf4ff;
      color: var(--primary);
    }

    .table-container {
      max-height: 650px;
      overflow: auto;
      border:
        1px solid
        var(--border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 14px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 4;
      background: #f7f9fb;
    }

    th,
    td {
      padding: 11px 13px;
      border-bottom:
        1px solid
        #e8ecf1;
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: #475467;
      font-size: 12px;
    }

    tbody tr:hover {
      background: #fafcff;
    }

    .time-cell {
      font-size: 15px;
      font-weight: 800;
    }

    .status-badge {
      display: inline-flex;
      min-width: 96px;
      justify-content: center;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .status-AVAILABLE {
      background:
        var(--available-background);
      color:
        var(--available-text);
    }

    .status-UNAVAILABLE {
      background:
        var(--unavailable-background);
      color:
        var(--unavailable-text);
    }

    .status-ALTERNATIVE {
      background:
        var(--alternative-background);
      color:
        var(--alternative-text);
    }

    .status-OUT_OF_PERIOD {
      background:
        var(--period-background);
      color:
        var(--period-text);
    }

    .status-IGNORED,
    .status-UNKNOWN {
      background:
        var(--ignored-background);
      color:
        var(--ignored-text);
    }

    .alternative-chip {
      display: inline-block;
      margin: 2px 5px 2px 0;
      padding: 5px 9px;
      border: 1px solid #dfc071;
      border-radius: 999px;
      background: #fffaf0;
      color: #795000;
      font-size: 12px;
      font-weight: 700;
    }

    .empty-value {
      color: #98a2b3;
    }

    .note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 850px) {
      .form-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .summary-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .page {
        padding:
          12px 9px 35px;
      }

      .panel {
        padding: 14px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .result-heading {
        display: block;
      }

      .checked-at {
        margin-top: 6px;
      }

      th,
      td {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="page-header">
      <h1>
        MLIT Slot Availability
      </h1>

      <p>
        선택한 날짜의 슬롯을 0000L부터
        2400L까지 30분 간격으로 확인합니다.
      </p>
    </header>

    <section class="panel">
      <div class="form-grid">
        <div class="field">
          <label for="mode">
            조회 기준
          </label>

          <select id="mode">
            <option value="departure">
              출발 슬롯 기준
            </option>

            <option value="arrival">
              도착 슬롯 기준
            </option>
          </select>
        </div>

        <div class="field">
          <label for="departureAirport">
            출발 공항 ICAO
          </label>

          <input
            id="departureAirport"
            maxlength="4"
            placeholder="RKSS"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="arrivalAirport">
            도착 공항 ICAO
          </label>

          <input
            id="arrivalAirport"
            maxlength="4"
            placeholder="RJTT"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="date">
            기준 날짜
          </label>

          <input
            id="date"
            type="date"
          >
        </div>

        <div class="field">
          <label for="duration">
            비행시간(분)
          </label>

          <input
            id="duration"
            type="number"
            min="0"
            max="1440"
            step="5"
            value="120"
          >
        </div>
      </div>

      <div class="button-row">
        <button
          id="searchButton"
          class="primary-button"
          onclick="runSearch()"
        >
          하루 전체 슬롯 조회
        </button>

        <button
          id="resetButton"
          class="secondary-button"
          onclick="resetForm()"
        >
          초기화
        </button>
      </div>

      <div
        id="loading"
        class="loading"
      >
        SWIM 로그인 및 49개 시간대를 확인하고 있습니다.<br>
        잠시 기다려 주세요.
      </div>

      <div
        id="error"
        class="error"
      ></div>

      <section
        id="results"
        class="results"
      >
        <div class="result-heading">
          <h2>조회 결과</h2>

          <div
            id="checkedAt"
            class="checked-at"
          ></div>
        </div>

        <div class="summary-grid">
          <div class="summary-card">
            <div class="summary-label">
              전체
            </div>

            <div
              id="summaryTotal"
              class="summary-number"
            >
              0
            </div>
          </div>

          <div class="summary-card">
            <div class="summary-label">
              사용 가능
            </div>

            <div
              id="summaryAvailable"
              class="summary-number"
            >
              0
            </div>
          </div>

          <div class="summary-card">
            <div class="summary-label">
              사용 불가
            </div>

            <div
              id="summaryUnavailable"
              class="summary-number"
            >
              0
            </div>
          </div>

          <div class="summary-card">
            <div class="summary-label">
              대체 시간 있음
            </div>

            <div
              id="summaryAlternative"
              class="summary-number"
            >
              0
            </div>
          </div>

          <div class="summary-card">
            <div class="summary-label">
              기간 외
            </div>

            <div
              id="summaryOutOfPeriod"
              class="summary-number"
            >
              0
            </div>
          </div>
        </div>

        <div class="filter-row">
          <button
            class="filter-button active"
            data-filter="ALL"
            onclick="setFilter('ALL', this)"
          >
            전체
          </button>

          <button
            class="filter-button"
            data-filter="AVAILABLE"
            onclick="setFilter('AVAILABLE', this)"
          >
            가능
          </button>

          <button
            class="filter-button"
            data-filter="UNAVAILABLE"
            onclick="setFilter('UNAVAILABLE', this)"
          >
            불가
          </button>

          <button
            class="filter-button"
            data-filter="ALTERNATIVE"
            onclick="setFilter('ALTERNATIVE', this)"
          >
            대체 시간
          </button>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Local Time</th>
                <th>결과</th>
                <th>대체 가능 시간</th>
                <th>API 요청 일시</th>
              </tr>
            </thead>

            <tbody id="resultBody"></tbody>
          </table>
        </div>

        <div class="note">
          2400L은 다음 날짜 00:00으로 변환하여 조회합니다.
          출발 기준에서는 선택한 시간이 출발시각이며,
          도착 기준에서는 선택한 시간이 도착시각입니다.
        </div>
      </section>
    </section>
  </main>

  <script>
    let allRows = [];
    let activeFilter = 'ALL';

    initialize();

    function initialize() {
      setDefaultDate();
      bindAirportInputs();
    }

    function setDefaultDate() {
      const now =
        new Date();

      const local =
        new Date(
          now.getTime() -
          now.getTimezoneOffset() *
          60000
        );

      document
        .getElementById('date')
        .value =
          local
            .toISOString()
            .substring(0, 10);
    }

    function bindAirportInputs() {
      [
        'departureAirport',
        'arrivalAirport'
      ].forEach(function(id) {
        document
          .getElementById(id)
          .addEventListener(
            'input',
            function() {
              this.value =
                this.value
                  .toUpperCase()
                  .replace(
                    /[^A-Z]/g,
                    ''
                  )
                  .substring(0, 4);
            }
          );
      });
    }

    function runSearch() {
      clearError();

      const request = {
        mode:
          getValue('mode'),

        departureAirport:
          getValue(
            'departureAirport'
          ).toUpperCase(),

        arrivalAirport:
          getValue(
            'arrivalAirport'
          ).toUpperCase(),

        date:
          normalizeDate(
            getValue('date')
          ),

        flightDurationMinutes:
          Number(
            getValue('duration')
          )
      };

      const validationError =
        validateRequest(request);

      if (validationError) {
        showError(validationError);
        return;
      }

      setLoading(true);

      google.script.run
        .withSuccessHandler(
          handleSuccess
        )
        .withFailureHandler(
          handleFailure
        )
        .checkFullDaySlots(request);
    }

    function handleSuccess(response) {
      setLoading(false);

      if (
        !response ||
        response.success !== true
      ) {
        showError(
          response &&
          response.message
            ? response.message
            : '조회에 실패했습니다.'
        );

        return;
      }

      allRows =
        Array.isArray(response.rows)
          ? response.rows
          : [];

      activeFilter = 'ALL';

      renderSummary(
        response.summary || {}
      );

      updateFilterButtons();
      renderRows();

      document
        .getElementById('checkedAt')
        .textContent =
          `조회 시각: ${response.checkedAt}`;

      document
        .getElementById('results')
        .style.display =
          'block';
    }

    function handleFailure(error) {
      setLoading(false);

      showError(
        error && error.message
          ? error.message
          : String(error)
      );
    }

    function renderSummary(summary) {
      setText(
        'summaryTotal',
        summary.total || 0
      );

      setText(
        'summaryAvailable',
        summary.available || 0
      );

      setText(
        'summaryUnavailable',
        summary.unavailable || 0
      );

      setText(
        'summaryAlternative',
        summary.alternative || 0
      );

      setText(
        'summaryOutOfPeriod',
        summary.outOfPeriod || 0
      );
    }

    function renderRows() {
      const body =
        document.getElementById(
          'resultBody'
        );

      const rows =
        allRows.filter(function(row) {
          if (activeFilter === 'ALL') {
            return true;
          }

          if (
            activeFilter ===
            'UNAVAILABLE'
          ) {
            return (
              row.status ===
                'UNAVAILABLE' ||
              row.status ===
                'OUT_OF_PERIOD' ||
              row.status ===
                'UNKNOWN'
            );
          }

          return (
            row.status ===
            activeFilter
          );
        });

      if (rows.length === 0) {
        body.innerHTML = `
          <tr>
            <td colspan="4">
              표시할 결과가 없습니다.
            </td>
          </tr>
        `;

        return;
      }

      body.innerHTML =
        rows
          .map(createRowHtml)
          .join('');
    }

    function createRowHtml(row) {
      const alternatives =
        Array.isArray(
          row.alternatives
        )
          ? row.alternatives
          : [];

      const alternativeHtml =
        alternatives.length > 0
          ? alternatives
              .map(function(time) {
                return `
                  <span
                    class="alternative-chip"
                  >
                    ${escapeHtml(time)}
                  </span>
                `;
              })
              .join('')
          : `
              <span class="empty-value">
                -
              </span>
            `;

      return `
        <tr>
          <td class="time-cell">
            ${escapeHtml(
              row.displayTime
            )}
          </td>

          <td>
            <span
              class="
                status-badge
                status-${escapeHtml(
                  row.status
                )}
              "
            >
              ${escapeHtml(
                getStatusLabel(
                  row.status
                )
              )}
            </span>
          </td>

          <td>
            ${alternativeHtml}
          </td>

          <td>
            ${escapeHtml(
              row.requestDate
            )}
            ${escapeHtml(
              row.requestTime
            )}
          </td>
        </tr>
      `;
    }

    function getStatusLabel(status) {
      const labels = {
        AVAILABLE:
          '✅ 사용 가능',

        UNAVAILABLE:
          '❌ 사용 불가',

        ALTERNATIVE:
          '🔄 대체 시간',

        OUT_OF_PERIOD:
          '⏰ 기간 외',

        IGNORED:
          '➖ 확인 제외',

        UNKNOWN:
          '⚠️ 결과 없음'
      };

      return (
        labels[status] ||
        status ||
        '알 수 없음'
      );
    }

    function setFilter(
      filter,
      button
    ) {
      activeFilter = filter;

      updateFilterButtons(
        button
      );

      renderRows();
    }

    function updateFilterButtons(
      selectedButton
    ) {
      document
        .querySelectorAll(
          '.filter-button'
        )
        .forEach(function(button) {
          const active =
            selectedButton
              ? button === selectedButton
              : button.dataset.filter ===
                activeFilter;

          button.classList.toggle(
            'active',
            active
          );
        });
    }

    function validateRequest(request) {
      if (
        !/^[A-Z]{4}$/.test(
          request.departureAirport
        )
      ) {
        return (
          '출발 공항 ICAO 코드를 4자리로 입력하세요.'
        );
      }

      if (
        !/^[A-Z]{4}$/.test(
          request.arrivalAirport
        )
      ) {
        return (
          '도착 공항 ICAO 코드를 4자리로 입력하세요.'
        );
      }

      if (
        !/^\d{4}\/\d{2}\/\d{2}$/.test(
          request.date
        )
      ) {
        return (
          '조회 날짜를 입력하세요.'
        );
      }

      if (
        !Number.isFinite(
          request.flightDurationMinutes
        ) ||
        request.flightDurationMinutes < 0
      ) {
        return (
          '비행시간을 분 단위로 입력하세요.'
        );
      }

      return '';
    }

    function resetForm() {
      document
        .getElementById('mode')
        .value =
          'departure';

      document
        .getElementById(
          'departureAirport'
        )
        .value =
          '';

      document
        .getElementById(
          'arrivalAirport'
        )
        .value =
          '';

      document
        .getElementById(
          'duration'
        )
        .value =
          '120';

      setDefaultDate();

      allRows = [];
      activeFilter = 'ALL';

      clearError();

      document
        .getElementById('results')
        .style.display =
          'none';
    }

    function setLoading(loading) {
      document
        .getElementById('loading')
        .style.display =
          loading
            ? 'block'
            : 'none';

      document
        .getElementById(
          'searchButton'
        )
        .disabled =
          loading;

      document
        .getElementById(
          'resetButton'
        )
        .disabled =
          loading;
    }

    function showError(message) {
      const element =
        document.getElementById(
          'error'
        );

      element.textContent =
        message;

      element.style.display =
        'block';
    }

    function clearError() {
      const element =
        document.getElementById(
          'error'
        );

      element.textContent = '';
      element.style.display = 'none';
    }

    function getValue(id) {
      return document
        .getElementById(id)
        .value
        .trim();
    }

    function normalizeDate(value) {
      return String(value)
        .replace(/-/g, '/');
    }

    function setText(id, value) {
      document
        .getElementById(id)
        .textContent =
          String(value);
    }

    function escapeHtml(value) {
      return String(
        value === null ||
        value === undefined
          ? ''
          : value
      )
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>
</body>
</html>
