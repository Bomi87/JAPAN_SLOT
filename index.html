<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Japan Slot Availability</title>

  <style>
    :root {
      --background: #f2f5f9;
      --card: #ffffff;
      --border: #d8e0e9;
      --text: #172033;
      --muted: #667085;

      --primary: #1769e0;
      --primary-hover: #1058bd;

      --available-bg: #e5f8ed;
      --available-text: #087443;
      --available-border: #9edbb8;

      --unavailable-bg: #fff0f0;
      --unavailable-text: #c12424;
      --unavailable-border: #efb0b0;

      --alternative-bg: #fff6df;
      --alternative-text: #936000;
      --alternative-border: #e2b74e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .page-header {
      margin-bottom: 18px;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--card);
      box-shadow:
        0 8px 28px
        rgba(16, 24, 40, 0.07);
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        0.9fr
        1fr
        1fr;
      gap: 14px;
      align-items: end;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #475467;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      padding: 0 13px;
      border: 1px solid #cfd7e1;
      border-radius: 9px;
      background: white;
      color: var(--text);
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline:
        3px solid
        rgba(23, 105, 224, 0.14);
      border-color: var(--primary);
    }

    .main-action-row {
      display: grid;
      grid-template-columns:
        minmax(260px, 1fr)
        auto
        auto;
      gap: 12px;
      align-items: end;
      margin-top: 18px;
    }

    .full-day-button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .full-day-button:hover {
      background: var(--primary-hover);
    }

    .single-check-row {
      display: grid;
      grid-template-columns:
        170px
        100px
        minmax(190px, 260px);
      gap: 10px;
      align-items: end;
    }

    .compact-field label {
      display: block;
      margin-bottom: 7px;
      color: #475467;
      font-size: 13px;
      font-weight: 700;
    }

    button {
      height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .single-search-button {
      background: #1f6fe5;
      color: white;
    }

    .single-search-button:hover {
      background: #155dc0;
    }

    .secondary-button {
      min-width: 92px;
      background: #edf1f5;
      color: #344054;
    }

    .utility-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .inline-result {
      min-height: 48px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #d0d7e2;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-weight: 700;
      line-height: 1.35;
    }

    .inline-result.empty {
      color: var(--muted);
      background: #f8fafc;
      border-color: #d8e0e9;
    }

    .inline-result.status-AVAILABLE {
      border-color: var(--available-border);
      background: var(--available-bg);
      color: var(--available-text);
    }

    .inline-result.status-UNAVAILABLE {
      border-color: var(--unavailable-border);
      background: var(--unavailable-bg);
      color: var(--unavailable-text);
    }

    .inline-result.status-ALTERNATIVE {
      border-color: var(--alternative-border);
      background: var(--alternative-bg);
      color: var(--alternative-text);
    }

    .inline-result-main {
      font-size: 16px;
      font-weight: 800;
    }

    .inline-result-sub {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      word-break: break-word;
    }

    .loading {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 11px;
      background: #edf4ff;
      color: #344f9b;
      text-align: center;
    }

    .error {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #efb4b4;
      border-radius: 10px;
      background: #fff0f0;
      color: #a51d1d;
      white-space: pre-wrap;
    }

    .connection-result {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid var(--available-border);
      border-radius: 10px;
      background: var(--available-bg);
      color: var(--available-text);
      text-align: center;
      font-weight: 700;
    }

    .result-panel {
      display: none;
      margin-top: 24px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fafbfc;
    }

    .result-title-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .result-title {
      font-size: 20px;
      font-weight: 800;
    }

    .result-subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-card {
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: white;
    }

    .summary-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 800;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    thead th {
      background: #f7f9fc;
      color: #475467;
      text-align: left;
      font-size: 13px;
      font-weight: 800;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    tbody td {
      padding: 13px 16px;
      border-bottom: 1px solid #eef2f6;
      font-size: 14px;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .status-chip {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .chip-AVAILABLE {
      border-color: var(--available-border);
      background: var(--available-bg);
      color: var(--available-text);
    }

    .chip-UNAVAILABLE {
      border-color: var(--unavailable-border);
      background: var(--unavailable-bg);
      color: var(--unavailable-text);
    }

    .chip-ALTERNATIVE {
      border-color: var(--alternative-border);
      background: var(--alternative-bg);
      color: var(--alternative-text);
    }

    .alt-text {
      color: #694f00;
      font-weight: 700;
    }

    .checked-at {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    @media (max-width: 1000px) {
      .main-action-row {
        grid-template-columns: 1fr;
      }

      .single-check-row {
        grid-template-columns:
          minmax(160px, 1fr)
          100px
          minmax(180px, 1fr);
      }

      .utility-row {
        justify-content: flex-start;
      }
    }

    @media (max-width: 760px) {
      .form-grid,
      .summary-grid,
      .single-check-row {
        grid-template-columns: 1fr;
      }

      .page {
        padding: 12px 10px 35px;
      }

      .panel {
        padding: 14px;
      }

      .main-action-row {
        gap: 16px;
      }

      .utility-row {
        flex-direction: column;
      }

      .utility-row button {
        width: 100%;
      }

      .inline-result {
        min-height: auto;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="page-header">
      <h1>Japan Slot Availability</h1>
      <p>
        일본 공항의 출발 또는 도착 슬롯을 조회합니다.
      </p>
    </header>

    <section class="panel">
      <div class="form-grid">
        <div class="field">
          <label for="mode">조회 기준</label>
          <select id="mode">
            <option value="arrival" selected>도착</option>
            <option value="departure">출발</option>
          </select>
        </div>

        <div class="field">
          <label for="airport">공항 ICAO</label>
          <input
            id="airport"
            maxlength="4"
            placeholder="예: RJTT"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="date">기준 날짜</label>
          <input
            id="date"
            type="date"
          >
        </div>
      </div>

      <div class="main-action-row">
        <button
          type="button"
          id="fullDayButton"
          class="full-day-button"
          onclick="runFullDaySearch()"
        >
          1일 전체 슬롯 조회 (0000L ~ 2400L)
        </button>

        <div class="single-check-row">
          <div class="compact-field">
            <label for="time">기준 시간</label>
            <select id="time"></select>
          </div>

          <button
            type="button"
            id="singleSearchButton"
            class="single-search-button"
            onclick="runSingleSearch()"
          >
            조회
          </button>

          <div
            id="singleResultInline"
            class="inline-result empty"
          >
            <div class="inline-result-main">-</div>
          </div>
        </div>
      </div>

      <div class="utility-row">
        <button
          type="button"
          id="connectionButton"
          class="secondary-button"
          onclick="testBackendConnection()"
        >
          연결 확인
        </button>

        <button
          type="button"
          id="resetButton"
          class="secondary-button"
          onclick="resetForm()"
        >
          초기화
        </button>
      </div>

      <div
        id="loading"
        class="loading"
      ></div>

      <div
        id="connectionResult"
        class="connection-result"
      ></div>

      <div
        id="error"
        class="error"
      ></div>

      <section
        id="resultPanel"
        class="result-panel"
      >
        <div class="result-title-row">
          <div>
            <div class="result-title">1일 전체 슬롯 조회 결과</div>
            <div
              id="resultSubtitle"
              class="result-subtitle"
            ></div>
          </div>
        </div>

        <div class="summary-grid">
          <div class="summary-card">
            <div class="summary-label">가능</div>
            <div
              id="summaryAvailable"
              class="summary-value"
            >
              0
            </div>
          </div>

          <div class="summary-card">
            <div class="summary-label">대체 시간</div>
            <div
              id="summaryAlternative"
              class="summary-value"
            >
              0
            </div>
          </div>

          <div class="summary-card">
            <div class="summary-label">불가</div>
            <div
              id="summaryUnavailable"
              class="summary-value"
            >
              0
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 110px;">시간</th>
                <th style="width: 130px;">결과</th>
                <th>대체 시간</th>
                <th style="width: 150px;">요청값</th>
              </tr>
            </thead>

            <tbody id="fullDayTableBody"></tbody>
          </table>
        </div>

        <div
          id="checkedAt"
          class="checked-at"
        ></div>
      </section>
    </section>
  </main>

  <script>
    /*
     * 아래 2개 값은 현재 사용 중인 값으로 넣으세요.
     */
    const BACKEND_URL =
      'https://script.google.com/macros/s/AKfycbwgM3HlDeB6LO6A-AmESiG7KBGA9lsrloLxt0S70ix-QY7Z8WyungoG9rO19FGOQGN7MQ/exec';

    const FRONTEND_API_KEY =
      'slot-app-2026-MOMOBOMI';

    const REQUEST_TIMEOUT_MS = 60000;

    initialize();

    function initialize() {
      setDefaultDate();
      createTimeOptions();
      bindAirportInput();
    }

    function setDefaultDate() {
      const now = new Date();

      const localDate = new Date(
        now.getTime() -
        now.getTimezoneOffset() * 60000
      );

      document.getElementById('date').value =
        localDate.toISOString().substring(0, 10);
    }

    function createTimeOptions() {
      const select =
        document.getElementById('time');

      let html = '';

      for (let index = 0; index <= 48; index++) {
        const totalMinutes = index * 30;
        const hour = Math.floor(totalMinutes / 60);
        const minute = totalMinutes % 60;

        const value =
          index === 48
            ? '24:00'
            : String(hour).padStart(2, '0') +
              ':' +
              String(minute).padStart(2, '0');

        const label =
          index === 48
            ? '2400L'
            : value.replace(':', '') + 'L';

        html += `
          <option value="${value}">
            ${label}
          </option>
        `;
      }

      select.innerHTML = html;
      select.value = '12:00';
    }

    function bindAirportInput() {
      document
        .getElementById('airport')
        .addEventListener(
          'input',
          function() {
            this.value =
              this.value
                .toUpperCase()
                .replace(/[^A-Z]/g, '')
                .substring(0, 4);
          }
        );
    }

    function buildBaseRequest() {
      return {
        mode: getValue('mode'),
        airport: getValue('airport').toUpperCase(),
        date: normalizeDate(getValue('date'))
      };
    }

    async function runFullDaySearch() {
      clearMessages();
      hideFullDayPanel();

      const request = buildBaseRequest();
      const validationError =
        validateBaseRequest(request);

      if (validationError) {
        showError(validationError);
        return;
      }

      setLoading(
        true,
        '하루 전체 슬롯(0000L~2400L)을 조회하고 있습니다.'
      );

      try {
        const response =
          await callBackend({
            action: 'checkFullDaySlots',
            apiKey: FRONTEND_API_KEY,
            data: request
          });

        renderFullDayResult(response);

      } catch (error) {
        showError(
          error && error.message
            ? error.message
            : String(error)
        );

      } finally {
        setLoading(false);
      }
    }

    async function runSingleSearch() {
      clearMessages();

      const request = buildBaseRequest();
      request.time = getValue('time');

      const validationError =
        validateSingleRequest(request);

      if (validationError) {
        showError(validationError);
        return;
      }

      setLoading(
        true,
        '선택한 시간의 슬롯을 조회하고 있습니다.'
      );

      try {
        const response =
          await callBackend({
            action: 'checkSingleSlot',
            apiKey: FRONTEND_API_KEY,
            data: request
          });

        renderSingleInlineResult(response);

      } catch (error) {
        showError(
          error && error.message
            ? error.message
            : String(error)
        );

      } finally {
        setLoading(false);
      }
    }

    function renderSingleInlineResult(response) {
      if (!response || response.success !== true) {
        showError(
          response && response.message
            ? response.message
            : '조회에 실패했습니다.'
        );
        return;
      }

      const row = response.result || {};
      const info = resolveStatusInfo(row);

      const element =
        document.getElementById(
          'singleResultInline'
        );

      element.className =
        'inline-result status-' + info.type;

      element.innerHTML = `
        <div class="inline-result-main">
          ${escapeHtml(info.label)}
        </div>
        ${
          info.detail
            ? `
              <div class="inline-result-sub">
                ${escapeHtml(info.detail)}
              </div>
            `
            : ''
        }
      `;
    }

    function renderFullDayResult(response) {
      if (!response || response.success !== true) {
        showError(
          response && response.message
            ? response.message
            : '조회에 실패했습니다.'
        );
        return;
      }

      const rows =
        Array.isArray(response.rows)
          ? response.rows
          : [];

      let availableCount = 0;
      let alternativeCount = 0;
      let unavailableCount = 0;

      const html = rows
        .map(function(row) {
          const info = resolveStatusInfo(row);

          if (info.type === 'AVAILABLE') {
            availableCount++;
          } else if (info.type === 'ALTERNATIVE') {
            alternativeCount++;
          } else {
            unavailableCount++;
          }

          return `
            <tr>
              <td>${escapeHtml(row.displayTime || '-')}</td>
              <td>
                <span class="status-chip chip-${info.type}">
                  ${escapeHtml(info.label)}
                </span>
              </td>
              <td class="alt-text">
                ${escapeHtml(info.altText || '-')}
              </td>
              <td>
                ${escapeHtml(
                  (row.requestDate || '-') +
                  ' ' +
                  (row.requestTime || '-')
                )}
              </td>
            </tr>
          `;
        })
        .join('');

      document.getElementById(
        'summaryAvailable'
      ).textContent = String(availableCount);

      document.getElementById(
        'summaryAlternative'
      ).textContent = String(alternativeCount);

      document.getElementById(
        'summaryUnavailable'
      ).textContent = String(unavailableCount);

      const subtitle =
        [
          response.input &&
          response.input.mode === 'departure'
            ? '출발'
            : '도착',
          response.input
            ? response.input.airport
            : '-',
          response.input
            ? response.input.date
            : '-'
        ].join(' / ');

      document.getElementById(
        'resultSubtitle'
      ).textContent = subtitle;

      document.getElementById(
        'fullDayTableBody'
      ).innerHTML = html;

      const elapsed =
        response.elapsedSeconds !== undefined
          ? ' · 소요시간: ' +
            response.elapsedSeconds +
            '초'
          : '';

      document.getElementById(
        'checkedAt'
      ).textContent =
        '조회 시각: ' +
        (response.checkedAt || '-') +
        elapsed;

      document.getElementById(
        'resultPanel'
      ).style.display = 'block';
    }

    function resolveStatusInfo(row) {
      const alternatives =
        getNormalizedAlternatives(row);

      if (alternatives.length > 0) {
        return {
          type: 'ALTERNATIVE',
          label: '대체 시간',
          detail: alternatives.join(', '),
          altText: alternatives.join(', ')
        };
      }

      if (
        row &&
        (
          row.status === 'AVAILABLE' ||
          row.ok === true
        )
      ) {
        return {
          type: 'AVAILABLE',
          label: '가능',
          detail: '',
          altText: '-'
        };
      }

      return {
        type: 'UNAVAILABLE',
        label: '불가',
        detail: '',
        altText: '-'
      };
    }

    function getNormalizedAlternatives(row) {
      const source =
        row && Array.isArray(row.alternatives)
          ? row.alternatives
          : [];

      return source
        .map(normalizeAlternativeTime)
        .filter(Boolean);
    }

    function normalizeAlternativeTime(value) {
      let text =
        String(
          value === null ||
          value === undefined
            ? ''
            : value
        ).trim();

      if (!text) {
        return '';
      }

      text = text
        .replaceAll('（', '(')
        .replaceAll('）', ')');

      text = text.replace(
        /^\s*\(\s*後\s*\)\s*/i,
        '익일 '
      );

      text = text.replace(
        /^\s*\(\s*후\s*\)\s*/i,
        '익일 '
      );

      text = text.replace(
        /^\s*後\s*/i,
        '익일 '
      );

      text = text.replace(
        /^\s*\(\s*前\s*\)\s*/i,
        '전일 '
      );

      text = text.replace(
        /^\s*\(\s*전\s*\)\s*/i,
        '전일 '
      );

      text = text.replace(
        /^\s*前\s*/i,
        '전일 '
      );

      text = text.replace(/\s+/g, ' ').trim();

      return text;
    }

    async function testBackendConnection() {
      clearMessages();
      setConnectionLoading(true);

      try {
        const response =
          await callBackend({
            action: 'ping',
            apiKey: FRONTEND_API_KEY
          });

        if (!response || response.success !== true) {
          throw new Error(
            response && response.message
              ? response.message
              : '연결 실패'
          );
        }

        showConnectionResult('백엔드 연결 성공');

      } catch (error) {
        showError(
          error && error.message
            ? error.message
            : String(error)
        );

      } finally {
        setConnectionLoading(false);
      }
    }

    async function callBackend(payload) {
      validateBackendUrl();

      const controller =
        new AbortController();

      const timeoutId = setTimeout(
        function() {
          controller.abort();
        },
        REQUEST_TIMEOUT_MS
      );

      try {
        const response = await fetch(
          BACKEND_URL,
          {
            method: 'POST',
            headers: {
              'Content-Type':
                'text/plain;charset=UTF-8'
            },
            body: JSON.stringify(payload),
            redirect: 'follow',
            signal: controller.signal,
            cache: 'no-store'
          }
        );

        if (!response.ok) {
          throw new Error(
            '백엔드 HTTP 오류: ' +
            response.status
          );
        }

        const text = await response.text();
        return JSON.parse(text);

      } catch (error) {
        if (
          error &&
          error.name === 'AbortError'
        ) {
          throw new Error(
            '백엔드 응답 시간이 초과되었습니다.'
          );
        }

        throw error;

      } finally {
        clearTimeout(timeoutId);
      }
    }

    function validateBaseRequest(request) {
      if (
        request.mode !== 'arrival' &&
        request.mode !== 'departure'
      ) {
        return '조회 기준을 선택하세요.';
      }

      if (!/^[A-Z]{4}$/.test(request.airport)) {
        return '공항 ICAO 코드를 영문 4자리로 입력하세요.';
      }

      if (!request.date) {
        return '날짜를 입력하세요.';
      }

      return '';
    }

    function validateSingleRequest(request) {
      const baseError =
        validateBaseRequest(request);

      if (baseError) {
        return baseError;
      }

      if (!request.time) {
        return '시간을 선택하세요.';
      }

      return '';
    }

    function resetForm() {
      document.getElementById('mode').value =
        'arrival';

      document.getElementById('airport').value =
        '';

      setDefaultDate();

      document.getElementById('time').value =
        '12:00';

      document.getElementById(
        'singleResultInline'
      ).className =
        'inline-result empty';

      document.getElementById(
        'singleResultInline'
      ).innerHTML =
        '<div class="inline-result-main">-</div>';

      clearMessages();
      hideFullDayPanel();
    }

    function hideFullDayPanel() {
      document.getElementById(
        'resultPanel'
      ).style.display = 'none';

      document.getElementById(
        'fullDayTableBody'
      ).innerHTML = '';
    }

    function setLoading(loading, message) {
      const loadingElement =
        document.getElementById('loading');

      loadingElement.style.display =
        loading ? 'block' : 'none';

      loadingElement.textContent =
        loading
          ? (message || '조회 중입니다.')
          : '';

      document.getElementById(
        'fullDayButton'
      ).disabled = loading;

      document.getElementById(
        'singleSearchButton'
      ).disabled = loading;
    }

    function setConnectionLoading(loading) {
      const button =
        document.getElementById(
          'connectionButton'
        );

      button.disabled = loading;
      button.textContent =
        loading ? '연결 중...' : '연결 확인';
    }

    function showConnectionResult(message) {
      const element =
        document.getElementById(
          'connectionResult'
        );

      element.textContent = message;
      element.style.display = 'block';
    }

    function showError(message) {
      const element =
        document.getElementById('error');

      element.textContent = message;
      element.style.display = 'block';
    }

    function clearMessages() {
      document.getElementById('error').style.display =
        'none';

      document.getElementById(
        'connectionResult'
      ).style.display = 'none';
    }

    function validateBackendUrl() {
      if (
        BACKEND_URL.includes(
          '여기에_배포된_AppsScript_exec_URL'
        )
      ) {
        throw new Error(
          'BACKEND_URL에 실제 Apps Script /exec 주소를 입력하세요.'
        );
      }
    }

    function getValue(id) {
      return document.getElementById(id).value.trim();
    }

    function normalizeDate(value) {
      return String(value).replace(/-/g, '/');
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>
</body>
</html>
