<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Japan Slot Checker</title>

  <style>
    :root {
      --background: #f2f5f9;
      --card: #ffffff;
      --border: #d8e0e9;
      --text: #172033;
      --muted: #667085;

      --primary: #1769e0;
      --primary-hover: #1058bd;

      --navy: #173f73;
      --navy-hover: #12345f;

      --teal: #0f9f9a;
      --teal-hover: #0b8581;

      --available-bg: #e5f8ed;
      --available-text: #087443;
      --available-border: #9edbb8;

      --unavailable-bg: #fff0f0;
      --unavailable-text: #c12424;
      --unavailable-border: #efb0b0;

      --alternative-bg: #fff6df;
      --alternative-text: #936000;
      --alternative-border: #e2b74e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);

      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .page-header {
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .page-header-text {
      flex: 1 1 320px;
      min-width: 0;
    }

    .page-logo-wrap {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
    }

    .page-logo {
      display: block;
      width: auto;
      height: 58px;
      max-width: 140px;
      object-fit: contain;
      image-rendering: auto;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--card);

      box-shadow:
        0 8px 28px
        rgba(16, 24, 40, 0.07);
    }

    .form-grid {
      display: grid;

      grid-template-columns:
        0.9fr
        1fr
        1fr;

      gap: 14px;
      align-items: end;
    }

    .form-grid .field {
      min-width: 0;
    }

    #date {
      display: block;
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }

    .field label,
    .compact-field label {
      display: block;
      margin-bottom: 7px;
      color: #475467;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      padding: 0 13px;
      border: 1px solid #cfd7e1;
      border-radius: 9px;
      background: white;
      color: var(--text);
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline:
        3px solid
        rgba(23, 105, 224, 0.14);

      border-color: var(--primary);
    }

    .action-section {
      display: grid;

      grid-template-columns:
        minmax(320px, 1fr)
        minmax(470px, 0.95fr);

      gap: 14px;
      margin-top: 18px;
      align-items: end;
    }

    .full-day-button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 10px;
      background: var(--navy);
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .full-day-button:hover {
      background: var(--navy-hover);
    }

    .single-check-row {
      display: grid;

      grid-template-columns:
        minmax(150px, 0.8fr)
        110px
        minmax(180px, 1fr);

      gap: 10px;
      align-items: end;
    }

    button {
      height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .single-search-button {
      background: var(--teal);
      color: white;
    }

    .single-search-button:hover {
      background: var(--teal-hover);
    }

    .secondary-button {
      min-width: 92px;
      background: #edf1f5;
      color: #344054;
    }

    .utility-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 12px;
    }

    .inline-result {
      min-height: 48px;
      padding: 9px 14px;
      border: 1px solid #d0d7e2;
      border-radius: 10px;
      background: #f8fafc;

      display: flex;
      flex-direction: column;
      justify-content: center;

      font-weight: 700;
      line-height: 1.35;
    }

    .inline-result.empty {
      color: var(--muted);
      background: #f8fafc;
      border-color: #d8e0e9;
    }

    .inline-result.status-AVAILABLE {
      border-color: var(--available-border);
      background: var(--available-bg);
      color: var(--available-text);
    }

    .inline-result.status-UNAVAILABLE {
      border-color: var(--unavailable-border);
      background: var(--unavailable-bg);
      color: var(--unavailable-text);
    }

    .inline-result.status-ALTERNATIVE {
      border-color: var(--alternative-border);
      background: var(--alternative-bg);
      color: var(--alternative-text);
    }

    .inline-result-main {
      font-size: 16px;
      font-weight: 800;
    }

    .inline-result-sub {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      word-break: break-word;
    }

    .loading {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 11px;
      background: #edf4ff;
      color: #344f9b;
      text-align: center;
    }

    .error {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #efb4b4;
      border-radius: 10px;
      background: #fff0f0;
      color: #a51d1d;
      white-space: pre-wrap;
    }

    .result-panel {
      display: none;
      margin-top: 24px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fafbfc;
    }

    .result-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .result-title {
      font-size: 20px;
      font-weight: 800;
    }

    .result-title-inline {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .cache-title-badge {
      display: none;
      padding: 3px 7px;
      border: 1px solid #c9cfd8;
      border-radius: 999px;
      background: #eef0f3;
      color: #667085;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .result-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

 

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
    }

    thead th {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: #f7f9fc;
      color: #475467;
      text-align: left;
      font-size: 13px;
      font-weight: 800;
    }

    tbody td {
      padding: 13px 16px;
      border-bottom: 1px solid #eef2f6;
      font-size: 14px;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .status-chip {
      display: inline-block;
      padding: 7px 12px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .chip-AVAILABLE {
      border-color: var(--available-border);
      background: var(--available-bg);
      color: var(--available-text);
    }

    .chip-UNAVAILABLE {
      border-color: var(--unavailable-border);
      background: var(--unavailable-bg);
      color: var(--unavailable-text);
    }

    .chip-ALTERNATIVE {
      border-color: var(--alternative-border);
      background: var(--alternative-bg);
      color: var(--alternative-text);
    }

    .alt-text {
      color: #694f00;
      font-weight: 700;
    }

    .checked-at {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .query-source-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 3px 7px;
      border: 1px solid #cfd7e1;
      border-radius: 999px;
      background: #f4f6f8;
      color: #475467;
      font-size: 11px;
      font-weight: 800;
      vertical-align: middle;
      white-space: nowrap;
    }

    .query-source-badge.cache {
      border-color: #b7c9e2;
      background: #edf4ff;
      color: #245a9f;
    }

    .query-source-badge.live {
      border-color: #a9d8bd;
      background: #eaf8ef;
      color: #087443;
    }

    @media (max-width: 1000px) {
      .action-section {
        grid-template-columns: 1fr;
      }

      .single-check-row {
        grid-template-columns:
          minmax(150px, 1fr)
          110px
          minmax(180px, 1fr);
      }
    }

    @media (max-width: 760px) {
      input,
      select {
        font-size: 16px;
      }

      .form-grid {
        grid-template-columns:
          minmax(0, 0.85fr)
          minmax(0, 1.15fr);
        gap: 10px;
      }

      .form-grid .field:nth-child(3) {
        grid-column: 1 / -1;
      }

      .single-check-row {
        grid-template-columns: 1fr;
      }

      .page {
        padding: 12px 10px 35px;
      }

      .panel {
        padding: 14px;
      }

      .page-header {
        align-items: flex-start;
      }

      .page-logo-wrap {
        width: 100%;
        justify-content: flex-start;
      }

      .page-logo {
        width: auto;
        height: 44px;
        max-width: 110px;
      }

      .utility-row {
        flex-direction: column;
      }

      .utility-row button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="authScreen" style="
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:#f2f5f9;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    color:#172033;
    font-size:15px;
    font-weight:700;
  ">
    승인 확인 중...
  </div>

  <div id="appRoot" style="display:none;">
  <main class="page">
    <header class="page-header">
      <div class="page-header-text">
        <h1>
          Japan Slot Checker
        </h1>

        <p>
          Japan Airport ARR & DEP Slot Check
        </p>
      </div>

      <div class="page-logo-wrap">
        <img
          src="SWIM LOGO.png"
          alt="SWIM Logo"
          class="page-logo"
        >
      </div>
    </header>

    <section class="panel">
      <div class="form-grid">
        <div class="field">
          <label for="mode">
            조회 기준
          </label>

          <select id="mode">
            <option
              value="arrival"
              selected
            >
              도착
            </option>

            <option value="departure">
              출발
            </option>
          </select>
        </div>

        <div class="field">
          <label for="airport">
            공항 ICAO
          </label>

          <input
            id="airport"
            maxlength="4"
            placeholder="예: RJTT"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="date">
            기준 날짜
          </label>

          <input
            id="date"
            type="date"
          >
        </div>
      </div>

      <div class="action-section">
        <button
          type="button"
          id="fullDayButton"
          class="full-day-button"
          onclick="runFullDaySearch()"
        >
          전체 Slot 조회 (0000L ~ 2400L)
        </button>

        <div class="single-check-row">
          <div class="compact-field">
            <label for="time">
              기준 시간
            </label>

            <input
              id="time"
              type="text"
              value=""
              maxlength="5"
              inputmode="numeric"
              placeholder="예: 12:05"
              autocomplete="off"
            >
          </div>

          <button
            type="button"
            id="singleSearchButton"
            class="single-search-button"
            onclick="runSingleSearch()"
          >
            조회
          </button>

          <div
            id="singleResultInline"
            class="inline-result empty"
          >
            <div class="inline-result-main">
              -
            </div>
          </div>
        </div>
      </div>

      <div class="utility-row">

        <button
          type="button"
          id="resetButton"
          class="secondary-button"
          onclick="resetForm()"
        >
          초기화
        </button>
      </div>

      <div
        id="loading"
        class="loading"
      ></div>

      <div
        id="error"
        class="error"
      ></div>

      <section
        id="resultPanel"
        class="result-panel"
      >
        <div class="result-title-row">
          <div>
            <div class="result-title-inline">
              <div class="result-title">
                전체 Slot 조회 결과
              </div>

              <span
                id="fullDayCacheBadge"
                class="cache-title-badge"
              >
                Cache
              </span>
            </div>

            <div
              id="resultSubtitle"
              class="result-subtitle"
            ></div>
          </div>
        </div>

      

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 110px;">
                  시간
                </th>

                <th style="width: 135px;">
                  결과
                </th>

                <th>
                  대체 시간
                </th>

                <th style="width: 180px;">
                  요청값
                </th>
              </tr>
            </thead>

            <tbody id="fullDayTableBody"></tbody>
          </table>
        </div>

        <div
          id="checkedAt"
          class="checked-at"
        ></div>
      </section>
    </section>
  </main>
  </div>

  <script>
    const BACKEND_URL =
      'https://script.google.com/macros/s/AKfycbyZ7QGWoL6YWVxI2aVHhtcMSPq13gk62gL2Zl6vXN7ToMa9LoSh8A6_pVSvPbtS8oVz/exec';

    const FRONTEND_API_KEY =
      'slot-app-2026-MOMOBOMI';

    const REQUEST_TIMEOUT_MS =
      120000;

    const FULL_DAY_REQUEST_TIMEOUT_MS =
      300000;

    const SINGLE_REQUEST_TIMEOUT_MS =
      180000;

    const STATUS_REQUEST_TIMEOUT_MS =
      30000;

    const CACHE_REQUEST_TIMEOUT_MS =
      30000;


    const STATUS_POLL_INTERVAL_MS =
      2500;

    const RECOVERY_POLL_INTERVAL_MS =
      2000;

    const RECOVERY_MAX_WAIT_MS =
      240000;
    let JAPAN_SLOT_APP_STARTED = false;
    let FULL_DAY_SEARCH_RUNNING = false;
    let SINGLE_SEARCH_RUNNING = false;

    function showAuthorizedApp() {
      const authScreen =
        document.getElementById('authScreen');

      const appRoot =
        document.getElementById('appRoot');

      if (authScreen) {
        authScreen.style.display = 'none';
      }

      if (appRoot) {
        appRoot.style.display = 'block';
      }
    }

    function startJapanSlotCheckerAfterAuth() {
      if (JAPAN_SLOT_APP_STARTED) {
        return;
      }

      JAPAN_SLOT_APP_STARTED = true;
      showAuthorizedApp();
      initialize();
    }

    (function waitForPortalAuth() {
      if (window.CURRENT_PORTAL_USER) {
        startJapanSlotCheckerAfterAuth();
        return;
      }

      setTimeout(
        waitForPortalAuth,
        200
      );
    })();

    function initialize() {
      setDefaultDate();
      setDefaultTime();
      bindAirportInput();
      bindTimeInput();
    }

    function setDefaultDate() {
      const now =
        new Date();

      const localDate =
        new Date(
          now.getTime() -
          now.getTimezoneOffset() * 60000
        );

      document
        .getElementById('date')
        .value =
          localDate
            .toISOString()
            .substring(0, 10);
    }

    function setDefaultTime() {
      document
        .getElementById('time')
        .value =
          '';
    }

    function bindAirportInput() {
      document
        .getElementById('airport')
        .addEventListener(
          'input',
          function() {
            this.value =
              this.value
                .toUpperCase()
                .replace(/[^A-Z]/g, '')
                .substring(0, 4);
          }
        );
    }

    function bindTimeInput() {
      const timeInput =
        document.getElementById('time');

      timeInput.addEventListener(
        'input',
        function() {
          let digits =
            this.value.replace(/\D/g, '');

          digits =
            digits.substring(0, 4);

          if (digits.length <= 2) {
            this.value =
              digits;

          } else {
            this.value =
              digits.substring(0, 2) +
              ':' +
              digits.substring(2);
          }
        }
      );

      timeInput.addEventListener(
        'blur',
        function() {
          const normalized =
            normalizeManualTime(
              this.value
            );

          if (normalized) {
            this.value =
              normalized;
          }
        }
      );

      timeInput.addEventListener(
        'keydown',
        function(event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            runSingleSearch();
          }
        }
      );
    }

    function normalizeManualTime(value) {
      const text =
        String(value || '')
          .trim()
          .replace(/[^\d:]/g, '');

      if (!text) {
        return '';
      }

      if (text === '2400') {
        return '24:00';
      }

      if (text === '24:00') {
        return '24:00';
      }

      if (/^\d{1,2}$/.test(text)) {
        const hour =
          Number(text);

        if (
          hour >= 0 &&
          hour <= 23
        ) {
          return (
            String(hour)
              .padStart(2, '0') +
            ':00'
          );
        }
      }

      if (/^\d{3,4}$/.test(text)) {
        const padded =
          text.padStart(4, '0');

        const hour =
          Number(
            padded.substring(0, 2)
          );

        const minute =
          Number(
            padded.substring(2, 4)
          );

        if (
          hour >= 0 &&
          hour <= 23 &&
          minute >= 0 &&
          minute <= 59
        ) {
          return (
            String(hour)
              .padStart(2, '0') +
            ':' +
            String(minute)
              .padStart(2, '0')
          );
        }
      }

      const match =
        text.match(
          /^(\d{1,2}):(\d{1,2})$/
        );

      if (match) {
        const hour =
          Number(match[1]);

        const minute =
          Number(match[2]);

        if (
          hour >= 0 &&
          hour <= 23 &&
          minute >= 0 &&
          minute <= 59
        ) {
          return (
            String(hour)
              .padStart(2, '0') +
            ':' +
            String(minute)
              .padStart(2, '0')
          );
        }
      }

      return '';
    }

    function buildBaseRequest() {
      return {
        mode:
          getValue('mode'),

        airport:
          getValue('airport')
            .toUpperCase(),

        date:
          normalizeDate(
            getValue('date')
          )
      };
    }

    async function runFullDaySearch() {
      if (FULL_DAY_SEARCH_RUNNING) {
        return;
      }

      FULL_DAY_SEARCH_RUNNING = true;

      clearMessages();
      hideFullDayPanel();

      const request =
        buildBaseRequest();

      const validationError =
        validateBaseRequest(
          request
        );

      if (validationError) {
        showError(
          validationError
        );

        FULL_DAY_SEARCH_RUNNING = false;
        return;
      }

      /*
       * 최고 속도 방식:
       * 사전 상태 확인이나 Trigger 접수 없이
       * 즉시 실제 SWIM 전체 조회를 시작합니다.
       */
      setLoading(
        true,
        '전체 Slot을 조회하고 있습니다.'
      );

      try {
        const response =
          await executeSlotRequestWithRecovery(
            'checkFullDaySlots',
            'FULL_DAY',
            request
          );

        renderFullDayResult(
          response
        );

      } catch (error) {
        showError(
          error && error.message
            ? error.message
            : String(error)
        );

      } finally {
        FULL_DAY_SEARCH_RUNNING = false;

        setLoading(
          false
        );
      }
    }

    async function runSingleSearch() {
      if (SINGLE_SEARCH_RUNNING) {
        return;
      }

      SINGLE_SEARCH_RUNNING = true;

      clearMessages();

      const request =
        buildBaseRequest();

      const normalizedTime =
        normalizeManualTime(
          getValue('time')
        );

      if (normalizedTime) {
        document
          .getElementById('time')
          .value =
            normalizedTime;
      }

      request.time =
        normalizedTime;

      const validationError =
        validateSingleRequest(
          request
        );

      if (validationError) {
        showError(
          validationError
        );

        SINGLE_SEARCH_RUNNING = false;
        return;
      }

      resetSingleResult(
        '조회 중...'
      );

      /*
       * 특정 시간 조회도 사전 상태 확인 없이 즉시 시작합니다.
       */
      setLoading(
        true,
        '선택한 시간의 Slot을 조회하고 있습니다.'
      );

      try {
        const response =
          await executeSlotRequestWithRecovery(
            'checkSingleSlot',
            'SINGLE',
            request
          );

        renderSingleInlineResult(
          response
        );

      } catch (error) {
        resetSingleResult('-');

        showError(
          error && error.message
            ? error.message
            : String(error)
        );

      } finally {
        SINGLE_SEARCH_RUNNING = false;

        setLoading(
          false
        );
      }
    }

    async function executeSlotRequestWithRecovery(
      action,
      requestType,
      request
    ) {
      try {
        /*
         * 실제 조회 요청은 한 번만 전송합니다.
         * 응답이 유실되더라도 즉시 동일 조회를 반복하지 않습니다.
         */
        return await callBackend(
          {
            action:
              action,

            apiKey:
              FRONTEND_API_KEY,

            data:
              request
          },
          {
            maxAttempts: 1,
            showRetryMessage: false,

            timeoutMs:
              requestType === 'FULL_DAY'
                ? FULL_DAY_REQUEST_TIMEOUT_MS
                : SINGLE_REQUEST_TIMEOUT_MS
          }
        );

      } catch (error) {
        if (
          !isRecoverableTransportError(
            error
          )
        ) {
          throw error;
        }

        return await recoverCompletedSlotRequest(
          action,
          requestType,
          request
        );
      }
    }


    async function recoverCompletedSlotRequest(
      action,
      requestType,
      request
    ) {
      const recoveryStartedAt =
        Date.now();

      let readyWithoutCacheCount =
        0;

      setLoading(
        true,
        '전체 Slot을 조회하고 있습니다.'
      );

      while (
        Date.now() -
          recoveryStartedAt <
        RECOVERY_MAX_WAIT_MS
      ) {
        await sleep(
          RECOVERY_POLL_INTERVAL_MS
        );

        let statusResponse;

        try {
          statusResponse =
            await callBackend(
              {
                action:
                  'checkRequestStatus',

                apiKey:
                  FRONTEND_API_KEY,

                data: {
                  ...request,

                  requestType:
                    requestType
                }
              },
              {
                maxAttempts: 2,
                showRetryMessage: false,
                timeoutMs:
                  STATUS_REQUEST_TIMEOUT_MS
              }
            );

        } catch (statusError) {
          /*
           * 상태 확인 자체가 한 번 실패해도
           * 원래 조회가 진행 중일 수 있으므로 계속 확인합니다.
           */
          continue;
        }

        if (
          !statusResponse ||
          statusResponse.success !== true
        ) {
          continue;
        }

        if (
          statusResponse.status ===
            'CACHE_READY'
        ) {
          const completedResponse =
            await callBackend(
              {
                action:
                  'getCompletedResult',

                apiKey:
                  FRONTEND_API_KEY,

                data: {
                  ...request,

                  requestType:
                    requestType
                }
              },
              {
                maxAttempts: 3,
                showRetryMessage: false,
                timeoutMs:
                  CACHE_REQUEST_TIMEOUT_MS
              }
            );

          if (
            completedResponse &&
            completedResponse.success === true &&
            completedResponse.status ===
              'CACHE_READY' &&
            completedResponse.result
          ) {
            return completedResponse.result;
          }

          continue;
        }

        if (
          statusResponse.status ===
            'WAITING'
        ) {
          readyWithoutCacheCount =
            0;

          setLoading(
            true,
            '전체 Slot을 조회하고 있습니다.'
          );

          continue;
        }

        if (
          statusResponse.status ===
            'READY'
        ) {
          readyWithoutCacheCount++;

          /*
           * 두 차례 연속 READY인데 캐시가 없으면
           * 최초 요청이 서버에 도달하지 않았을 가능성이 큽니다.
           * 이 경우에만 실제 조회를 한 번 다시 시작합니다.
           */
          if (
            readyWithoutCacheCount >= 2
          ) {
            setLoading(
              true,
              '전체 Slot을 조회하고 있습니다.'
            );

            return await callBackend(
              {
                action:
                  action,

                apiKey:
                  FRONTEND_API_KEY,

                data:
                  request
              },
              {
                maxAttempts: 2,
                showRetryMessage: false,

                timeoutMs:
                  requestType === 'FULL_DAY'
                    ? FULL_DAY_REQUEST_TIMEOUT_MS
                    : SINGLE_REQUEST_TIMEOUT_MS
              }
            );
          }
        }
      }

      throw new Error(
        '서버에서 조회 처리가 완료되었는지 확인하지 못했습니다.\n' +
        '잠시 후 같은 조건으로 다시 조회해 주세요.'
      );
    }


    function isRecoverableTransportError(
      error
    ) {
      if (!error) {
        return true;
      }

      const status =
        Number(
          error.status || 0
        );

      const message =
        String(
          error.message || ''
        );

      return (
        error.name === 'TypeError' ||
        /failed to fetch/i.test(
          message
        ) ||
        /networkerror/i.test(
          message
        ) ||
        /load failed/i.test(
          message
        ) ||
        /시간이 초과/i.test(
          message
        ) ||
        status === 404 ||
        status === 408 ||
        status === 429 ||
        status >= 500
      );
    }


    async function waitUntilBackendReady(
      requestType,
      request,
      activeMessage
    ) {
      while (true) {
        const statusResponse =
          await callBackend({
            action:
              'checkRequestStatus',

            apiKey:
              FRONTEND_API_KEY,

            data: {
              ...request,

              requestType:
                requestType
            }
          },
          {
            maxAttempts: 2,
            showRetryMessage: false,
            timeoutMs:
              STATUS_REQUEST_TIMEOUT_MS
          }
        );

        if (
          !statusResponse ||
          statusResponse.success !== true
        ) {
          throw new Error(
            statusResponse &&
            statusResponse.message
              ? statusResponse.message
              : '조회 상태를 확인하지 못했습니다.'
          );
        }

        if (
          statusResponse.status ===
            'CACHE_READY'
        ) {
          setLoading(
            true,
            '저장된 Slot 데이터를 불러오고 있습니다.'
          );

          return;
        }

        if (
          statusResponse.status ===
            'READY'
        ) {
          setLoading(
            true,
            activeMessage
          );

          return;
        }

        if (
          statusResponse.status !==
            'WAITING'
        ) {
          throw new Error(
            '알 수 없는 조회 상태입니다.'
          );
        }

        setLoading(
          true,
          '다른 사용자의 조회가 진행 중입니다. 조회가 끝날 때까지 잠시 기다려 주세요.'
        );

        await sleep(
          STATUS_POLL_INTERVAL_MS
        );
      }
    }


    function sleep(
      milliseconds
    ) {
      return new Promise(
        function(resolve) {
          setTimeout(
            resolve,
            milliseconds
          );
        }
      );
    }


    function renderSingleInlineResult(

    }

    function renderFullDayResult(

      ) {

          response.message

            : '조회에 실패했습니다.'

        return;

      const rows =

    function getQuerySourceInfo(
      response
    ) {
      if (
        response &&
        response.cacheHit === true
      ) {
        if (
          response.cacheSource ===
            'RECOVERED_CACHE'
        ) {
          return {
            label: '응답 복구',
            className: 'live'
          };
        }

        if (
          response.cacheSource ===
            'CACHE_AFTER_LOCK'
        ) {
          return {
            label: 'Cache · 대기 후',
            className: 'cache'
          };
        }

        return {
          label: 'Cache',
          className: 'cache'
        };
      }

      return null;
    }


    function resolveStatusInfo(
      row
    ) {
      const alternatives =
        getNormalizedAlternatives(
          row
        );

      /*
       * 실제 대체 시간 값이 있을 때만
       * 대체 시간으로 표시
       */
      if (
        alternatives.length > 0
      ) {
        return {
          type:
            'ALTERNATIVE',

          label:
            '대체 시간',

          detail:
            alternatives.join(', '),

          altText:
            alternatives.join(', ')
        };
      }

      /*
       * Slot 가능
       */
      if (
        row &&
        (
          row.status ===
            'AVAILABLE' ||
          row.ok === true
        )
      ) {
        return {
          type:
            'AVAILABLE',

          label:
            '가능',

          detail:
            '',

          altText:
            '-'
        };
      }

      /*
       * 나머지는 전부 불가
       */
      return {
        type:
          'UNAVAILABLE',

        label:
          '불가',

        detail:
          '',

        altText:
          '-'
      };
    }

    function getNormalizedAlternatives(
      row
    ) {
      const source =
        row &&
        Array.isArray(
          row.alternatives
        )
          ? row.alternatives
          : [];

      return source
        .map(
          normalizeAlternativeTime
        )
        .filter(
          function(value) {
            return isValidAlternativeTime(
              value
            );
          }
        );
    }

    function isValidAlternativeTime(
      value
    ) {
      if (!value) {
        return false;
      }

      const text =
        String(value)
          .trim();

      if (!text) {
        return false;
      }

      const compact =
        text
          .replace(/\s+/g, '')
          .replace(/[，]/g, ',');

      /*
       * SWIM의 빈 대체 시간 표시 제외
       */
      const emptyValues = [
        '-',
        '--',
        '---',
        '—',
        '―',
        '－',
        '-,-',
        '--,--',
        '—,—',
        '―,―',
        '－,－',
        'null',
        'undefined'
      ];

      if (
        emptyValues.includes(
          compact.toLowerCase()
        )
      ) {
        return false;
      }

      /*
       * 실제 시간 형식만 인정
       *
       * 12:30
       * 익일 00:30
       * 전일 23:50
       */
      return (
        /^(익일\s*|전일\s*)?([01]\d|2[0-3]):[0-5]\d$/
          .test(text)
      );
    }

    function normalizeAlternativeTime(
      value
    ) {
      let text =
        String(
          value === null ||
          value === undefined
            ? ''
            : value
        ).trim();

      if (!text) {
        return '';
      }

      text =
        text
          .replaceAll(
            '（',
            '('
          )
          .replaceAll(
            '）',
            ')'
          );

      text =
        text.replace(
          /^\s*\(\s*後\s*\)\s*/i,
          '익일 '
        );

      text =
        text.replace(
          /^\s*\(\s*후\s*\)\s*/i,
          '익일 '
        );

      text =
        text.replace(
          /^\s*後\s*/i,
          '익일 '
        );

      text =
        text.replace(
          /^\s*\(\s*前\s*\)\s*/i,
          '전일 '
        );

      text =
        text.replace(
          /^\s*\(\s*전\s*\)\s*/i,
          '전일 '
        );

      text =
        text.replace(
          /^\s*前\s*/i,
          '전일 '
        );

      text =
        text.replace(
          /\s+/g,
          ' '
        ).trim();

      return text;
    }

    async function callBackend(
      payload,
      options
    ) {
      validateBackendUrl();

      const settings =
        options || {};

      const maxAttempts =
        Math.max(
          1,
          Number(
            settings.maxAttempts
          ) || 4
        );

      const showRetryMessage =
        settings.showRetryMessage !== false;

      const timeoutMs =
        Math.max(
          1000,
          Number(
            settings.timeoutMs
          ) ||
          REQUEST_TIMEOUT_MS
        );

      let lastError = null;

      for (
        let attempt = 1;
        attempt <= maxAttempts;
        attempt++
      ) {
        const controller =
          new AbortController();

        const timeoutId =
          setTimeout(
            function() {
              controller.abort();
            },
            timeoutMs
          );

        try {
          if (
            attempt > 1 &&
            showRetryMessage
          ) {
            setLoading(
              true,
              '서버 응답을 다시 확인하고 있습니다. (' +
              attempt +
              '/' +
              maxAttempts +
              ')'
            );
          }

          const response =
            await fetch(
              BACKEND_URL,
              {
                method:
                  'POST',

                headers: {
                  'Content-Type':
                    'text/plain;charset=UTF-8'
                },

                body:
                  JSON.stringify(
                    payload
                  ),

                redirect:
                  'follow',

                signal:
                  controller.signal,

                cache:
                  'no-store'
              }
            );

          if (!response.ok) {
            const errorText =
              await response.text();

            const httpError =
              new Error(
                '백엔드 HTTP 오류: ' +
                response.status +
                '\n\n응답 주소:\n' +
                response.url +
                '\n\n응답 내용:\n' +
                errorText.substring(
                  0,
                  500
                )
              );

            httpError.status =
              response.status;

            throw httpError;
          }

          const text =
            await response.text();

          try {
            return JSON.parse(
              text
            );

          } catch (error) {
            const parseError =
              new Error(
                '백엔드 응답이 JSON 형식이 아닙니다.\n\n' +
                text.substring(
                  0,
                  500
                )
              );

            parseError.nonRetryable =
              true;

            throw parseError;
          }

        } catch (error) {
          if (
            error &&
            error.name ===
              'AbortError'
          ) {
            lastError =
              new Error(
                '백엔드 응답 시간이 초과되었습니다.'
              );

          } else {
            lastError =
              error instanceof Error
                ? error
                : new Error(
                    String(error)
                  );
          }

          const status =
            Number(
              lastError.status || 0
            );

          const message =
            String(
              lastError.message || ''
            );

          const retryable =
            lastError.nonRetryable !== true &&
            (
              lastError.name ===
                'TypeError' ||
              /failed to fetch/i.test(
                message
              ) ||
              /networkerror/i.test(
                message
              ) ||
              /load failed/i.test(
                message
              ) ||
              /시간이 초과/i.test(
                message
              ) ||
              status === 404 ||
              status === 408 ||
              status === 429 ||
              status >= 500
            );

          if (
            !retryable ||
            attempt >= maxAttempts
          ) {
            if (
              /failed to fetch/i.test(
                message
              ) ||
              lastError.name ===
                'TypeError'
            ) {
              throw new Error(
                '백엔드 연결에 일시적으로 실패했습니다.\n' +
                '잠시 후 다시 조회해 주세요.'
              );
            }

            throw lastError;
          }

          console.warn(
            '백엔드 연결 실패, 자동 재시도:',
            attempt + '/' + maxAttempts,
            message
          );

          await sleep(
            Math.min(
              1500 * attempt,
              5000
            )
          );

        } finally {
          clearTimeout(
            timeoutId
          );
        }
      }

      throw (
        lastError ||
        new Error(
          '백엔드 연결에 실패했습니다.'
        )
      );
    }


    function validateBaseRequest(
      request
    ) {
      if (
        request.mode !==
          'arrival' &&
        request.mode !==
          'departure'
      ) {
        return (
          '조회 기준을 선택하세요.'
        );
      }

      if (
        !/^[A-Z]{4}$/.test(
          request.airport
        )
      ) {
        return (
          '공항 ICAO 코드를 영문 4자리로 입력하세요.'
        );
      }

      if (
        !request.date
      ) {
        return (
          '날짜를 입력하세요.'
        );
      }

      return '';
    }

    function validateSingleRequest(
      request
    ) {
      const baseError =
        validateBaseRequest(
          request
        );

      if (baseError) {
        return baseError;
      }

      if (!request.time) {
        return (
          '기준 시간을 HH:MM 형식으로 입력하세요.\n' +
          '예: 12:05, 12:10, 23:55, 24:00'
        );
      }

      if (
        request.time !==
          '24:00' &&
        !/^([01]\d|2[0-3]):[0-5]\d$/
          .test(
            request.time
          )
      ) {
        return (
          '기준 시간을 올바르게 입력하세요.\n' +
          '예: 12:05, 12:10, 23:55, 24:00'
        );
      }

      return '';
    }

        .getElementById(
          'resultPanel'
        )
        .style.display =

    function showError(
      message
    ) {
      const element =
        document.getElementById(
          'error'
        );

      element.textContent =
        message;

      element.style.display =
        'block';
    }

    function clearMessages() {
      document
        .getElementById(
          'error'
        )
        .style.display =
          'none';
    }

    function validateBackendUrl() {
      if (
        !BACKEND_URL ||
        !BACKEND_URL.includes(
          'script.google.com/macros/s/'
        ) ||
        !BACKEND_URL.endsWith(
          '/exec'
        )
      ) {
        throw new Error(
          'BACKEND_URL을 확인하세요.'
        );
      }
    }

    function getValue(
      id
    ) {
      return document
        .getElementById(id)
        .value
        .trim();
    }

    function normalizeDate(
      value
    ) {
      return String(
        value || ''
      ).replace(
        /-/g,
        '/'
      );
    }

    function escapeHtml(
      value
    ) {
      return String(
        value === null ||
        value === undefined
          ? ''
          : value
      )
        .replaceAll(
          '&',
          '&amp;'
        )
        .replaceAll(
          '<',
          '&lt;'
        )
        .replaceAll(
          '>',
          '&gt;'
        )
        .replaceAll(
          '"',
          '&quot;'
        )
        .replaceAll(
          "'",
          '&#039;'
        );
    }
  </script>
